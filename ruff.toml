line-length = 88
target-version = "py311"

# Only lint kil/backend/core/ strictly — everything else is legacy/scripts
exclude = [
    "analytics/",
    "scripts/",
    "data/",
    "kil/backend/legacy/",
    "kil/backend/scripts/",
    "kil/backend/app.py",
    "kil/db/",
    "kil/rules/",
    "kil/scripts/",
    "kil/worker/",
    "mobile/",
    "supabase/",
]

[lint]
select = ["E", "F", "I", "B", "UP", "PL", "RUF"]
ignore = [
    "PLC0415",   # allow lazy imports inside try/except (optional Flask ctx pattern)
    "PLR0913",   # allow >5 args in constructors/helpers (AuthUser, db fns)
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
