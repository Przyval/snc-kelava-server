<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIL Control Tower</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Leaflet Config -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        .leaflet-container { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-600" x-data="dashboard()" x-init="init()">

  <!-- Top Navigation -->
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center gap-3">
          <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-xl">
             KIL
          </div>
          <div>
              <h1 class="text-xl font-bold text-slate-800 tracking-tight">Control Tower</h1>
              <p class="text-xs text-slate-500">Kelava Intelligence Layer</p>
          </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-right hidden sm:block">
                <p class="text-sm font-medium text-slate-900" x-text="stats.date"></p>
                <p class="text-xs text-slate-500 animate-pulse">Live Connection</p>
            </div>
            <button @click="refresh()" class="p-2 text-slate-400 hover:text-blue-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
            </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- KPI Grid -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        
        <!-- Job Card -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
             <div class="flex justify-between items-start">
                 <div>
                     <p class="text-sm font-medium text-slate-500">Jobs Today</p>
                     <h3 class="text-2xl font-bold text-slate-900 mt-1" x-text="stats.jobs?.created || 0">0</h3>
                 </div>
                 <div class="p-2 bg-blue-50 text-blue-600 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                 </div>
             </div>
             <div class="mt-2 flex gap-2 text-xs">
                 <span class="text-slate-400">Assigned: <span class="font-medium text-slate-600" x-text="stats.jobs?.assigned || 0"></span></span>
             </div>
        </div>

        <!-- Visits Card -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
             <div class="flex justify-between items-start">
                 <div>
                     <p class="text-sm font-medium text-slate-500">Visits Done</p>
                     <h3 class="text-2xl font-bold text-slate-900 mt-1" x-text="stats.visits?.completed || 0">0</h3>
                 </div>
                 <div class="p-2 bg-green-50 text-green-600 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                 </div>
             </div>
             <div class="mt-2 flex gap-2 text-xs">
                 <span class="text-slate-400">Started: <span class="font-medium text-slate-600" x-text="stats.visits?.started || 0"></span></span>
             </div>
        </div>

        <!-- Issues Card -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
             <div class="flex justify-between items-start">
                 <div>
                     <p class="text-sm font-medium text-slate-500">Open Issues</p>
                     <h3 class="text-2xl font-bold text-slate-900 mt-1" x-text="(stats.issues?.open_high + stats.issues?.open_medium + stats.issues?.open_low + stats.issues?.open_critical) || 0">0</h3>
                 </div>
                 <div class="p-2 bg-orange-50 text-orange-600 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                 </div>
             </div>
             <div class="mt-2 flex gap-2 text-xs">
                 <span class="text-red-500 font-medium" x-show="stats.issues?.open_critical > 0" x-text="stats.issues?.open_critical + ' Critical'"></span>
                 <span class="text-orange-500 font-medium" x-show="stats.issues?.open_high > 0" x-text="stats.issues?.open_high + ' High'"></span>
             </div>
        </div>

        <!-- Techs Card -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
             <div class="flex justify-between items-start">
                 <div>
                     <p class="text-sm font-medium text-slate-500">Active Techs</p>
                     <h3 class="text-2xl font-bold text-slate-900 mt-1" x-text="stats.technicians_active || 0">0</h3>
                 </div>
                 <div class="p-2 bg-purple-50 text-purple-600 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                 </div>
             </div>
             <div class="mt-2 text-xs text-slate-400">
                 Monitoring real-time
             </div>
        </div>
    </div>

      <!-- Main Content Grid -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left: Map & Feed (Col Span 2) -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Map Card -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h3 class="font-semibold text-slate-800 mb-4 flex items-center justify-between">
                    <span>Live Fleet Map</span>
                    <span class="text-xs font-normal text-slate-500 bg-slate-100 px-2 py-1 rounded-full animate-pulse">Live</span>
                </h3>
                <div id="map" class="h-80 rounded-lg bg-slate-50 border border-slate-100 relative z-0"></div>
            </div>

            <!-- Issues Feed -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h3 class="font-semibold text-slate-800 mb-4">Live Issues Feed</h3>
                <div class="space-y-3 max-h-[300px] overflow-y-auto">
                    <template x-for="issue in issues" :key="issue.id">
                        <div class="p-3 rounded-lg border-l-4 bg-slate-50 hover:bg-slate-100 transition-colors"
                             :class="{
                                'border-red-500': issue.severity === 'critical',
                                'border-orange-500': issue.severity === 'high', 
                                'border-yellow-500': issue.severity === 'medium',
                                'border-blue-500': issue.severity === 'low'
                             }">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-xs font-bold uppercase tracking-wider text-slate-500" x-text="issue.issue_type"></p>
                                    <p class="font-medium text-slate-900" x-text="issue.title"></p>
                                    <p class="text-sm text-slate-600 mt-1" x-text="issue.description"></p>
                                </div>
                                <span class="text-xs text-slate-400 whitespace-nowrap" x-text="formatTime(issue.created_at)"></span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Right: Event Stream -->
        <div class="space-y-6">
             <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 h-full">
                <h3 class="font-semibold text-slate-800 mb-4">Event Stream (24h)</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-slate-500 uppercase bg-slate-50">
                            <tr>
                                <th class="px-3 py-2">Event</th>
                                <th class="px-3 py-2 text-right">Count</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="(count, type) in events" :key="type">
                                <tr class="border-b last:border-0 hover:bg-slate-50">
                                    <td class="px-3 py-2 font-medium text-slate-700" x-text="type"></td>
                                    <td class="px-3 py-2 text-right font-mono text-slate-600" x-text="count"></td>
                                </tr>
                            </template>
                            <tr x-show="Object.keys(events).length === 0">
                                <td colspan="2" class="px-3 py-4 text-center text-slate-400">No events today</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function dashboard() {
        return {
            stats: {},
            issues: [],
            events: {},
            map: null,
            markers: {},

            init() {
                this.initMap();
                this.refresh();
                setInterval(() => this.refresh(), 10000); // Auto-refresh 10s
            },

            initMap() {
                // Initialize Leaflet Map
                this.map = L.map('map').setView([-7.2575, 112.7521], 12); // Surabaya Center
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                    subdomains: 'abcd',
                    maxZoom: 19
                }).addTo(this.map);
            },

            async refresh() {
                try {
                    // Fetch Summary
                    const summaryRes = await fetch('/api/v1/ops/summary');
                    const summary = await summaryRes.json();
                    this.stats = summary;
                    
                    // Fetch Issues
                    const issuesRes = await fetch('/api/v1/issues?limit=10');
                    const issuesData = await issuesRes.json();
                    this.issues = issuesData.issues;

                    // Fetch Events
                    const eventsRes = await fetch('/api/v1/events/summary?days=1');
                    const eventsData = await eventsRes.json();
                    const todayKey = summary.date;
                    this.events = eventsData.summary[todayKey] || {};
                    
                    // Fetch Map Positions
                    const mapRes = await fetch('/api/v1/map/positions');
                    const mapData = await mapRes.json();
                    this.updateMap(mapData.positions);

                } catch (e) {
                    console.error("Fetch error:", e);
                }
            },
            
            updateMap(positions) {
                if (!this.map) return;
                
                // Clear old markers? Or update. 
                // For better UX, update existing.
                
                positions.forEach(pos => {
                    const lat = pos.latitude;
                    const lng = pos.longitude;
                    const id = pos.internal_id;
                    const label = `<b>Tech #${id}</b><br>${pos.time_str}`;

                    if (this.markers[id]) {
                        this.markers[id].setLatLng([lat, lng]).setPopupContent(label);
                    } else {
                        // Create marker
                        const marker = L.circleMarker([lat, lng], {
                            radius: 8,
                            fillColor: "#3b82f6",
                            color: "#fff",
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.8
                        }).addTo(this.map);
                        
                        marker.bindPopup(label);
                        this.markers[id] = marker;
                    }
                });
            },

            formatTime(dateStr) {
                 if (!dateStr) return '';
                 const date = new Date(dateStr);
                 const now = new Date();
                 const diffMs = now - date;
                 const diffMins = Math.floor(diffMs / 60000);
                 
                 if (diffMins < 60) return `${diffMins}m ago`;
                 const diffHours = Math.floor(diffMins / 60);
                 if (diffHours < 24) return `${diffHours}h ago`;
                 return date.toLocaleDateString();
            }
        }
    }
  </script>
</body>
</html>
