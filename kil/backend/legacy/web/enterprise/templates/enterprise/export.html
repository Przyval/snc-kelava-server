{% extends "enterprise/base.html" %}
{% block title %}Data Export{% endblock %}

{% block content %}
<div x-data="dataExport()" x-init="init()" class="p-6 max-w-6xl mx-auto">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Data Export</h1>
            <p class="text-sm text-gray-500 mt-1">Download operational data as CSV files</p>
        </div>
    </div>

    <!-- Global Date Range -->
    <div class="bg-gray-50 rounded-xl p-4 mb-6 flex items-center gap-4 flex-wrap">
        <span class="text-sm text-gray-500 font-medium">Default Date Range:</span>
        <div class="flex items-center gap-2">
            <input type="date" x-model="globalStart" class="border rounded-lg px-3 py-2 text-sm">
            <span class="text-orange-500 font-medium">to</span>
            <input type="date" x-model="globalEnd" class="border rounded-lg px-3 py-2 text-sm">
        </div>
        <button @click="applyGlobalDates()"
                class="px-3 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-300 transition-colors">
            Apply to All
        </button>
    </div>

    <!-- Export Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="exp in exports" :key="exp.key">
            <div class="bg-white rounded-xl border shadow-sm hover:shadow-md transition-shadow">
                <div class="p-5">
                    <!-- Icon + Title -->
                    <div class="flex items-start gap-3 mb-4">
                        <div class="w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0"
                             :class="exp.iconBg">
                            <svg class="w-5 h-5" :class="exp.iconText" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" :d="exp.iconPath"/>
                            </svg>
                        </div>
                        <div>
                            <h3 class="font-semibold text-gray-900" x-text="exp.title"></h3>
                            <p class="text-xs text-gray-400 mt-0.5" x-text="exp.description"></p>
                        </div>
                    </div>

                    <!-- Date Range -->
                    <div class="space-y-2 mb-4">
                        <div class="flex items-center gap-2">
                            <label class="text-xs text-gray-500 w-12">From</label>
                            <input type="date" x-model="exp.startDate" class="flex-1 border rounded-lg px-2.5 py-1.5 text-sm">
                        </div>
                        <div class="flex items-center gap-2">
                            <label class="text-xs text-gray-500 w-12">To</label>
                            <input type="date" x-model="exp.endDate" class="flex-1 border rounded-lg px-2.5 py-1.5 text-sm">
                        </div>
                    </div>

                    <!-- Download Button -->
                    <button @click="downloadExport(exp)" :disabled="exp.downloading"
                            class="w-full px-4 py-2.5 bg-orange-500 text-white rounded-lg text-sm font-medium hover:bg-orange-600 disabled:opacity-50 flex items-center justify-center gap-2 transition-colors">
                        <svg x-show="exp.downloading" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                        <svg x-show="!exp.downloading" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        <span x-text="exp.downloading ? 'Preparing...' : 'Download CSV'"></span>
                    </button>
                </div>

                <!-- Success feedback -->
                <div x-show="exp.lastDownloaded" x-transition class="px-5 pb-4">
                    <p class="text-xs text-green-600 flex items-center gap-1">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                        <span x-text="'Downloaded ' + exp.lastDownloaded"></span>
                    </p>
                </div>
            </div>
        </template>
    </div>

    <!-- Available Exports from API -->
    <template x-if="serverExports.length > 0">
        <div class="mt-8">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">Additional Exports</h2>
            <div class="bg-white rounded-xl border shadow-sm divide-y">
                <template x-for="se in serverExports" :key="se.key">
                    <div class="px-5 py-4 flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-900" x-text="se.title || se.key"></p>
                            <p class="text-xs text-gray-400" x-text="se.description || ''"></p>
                        </div>
                        <button @click="downloadServerExport(se)"
                                class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition-colors flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                            Download
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </template>

    <!-- Loading overlay -->
    <div x-show="loading" class="fixed inset-0 bg-white/50 z-10 flex items-center justify-center" x-cloak>
        <div class="bg-white rounded-xl shadow-lg p-6 flex items-center gap-3">
            <svg class="animate-spin w-5 h-5 text-orange-500" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <span class="text-sm text-gray-600">Loading exports...</span>
        </div>
    </div>
</div>

<script>
function dataExport() {
    const today = new Date().toISOString().split('T')[0];
    const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];

    return {
        loading: false,
        globalStart: thirtyDaysAgo,
        globalEnd: today,
        serverExports: [],
        exports: [
            {
                key: 'visits',
                title: 'Visits',
                description: 'All visit records with check-in/out times, duration, and status',
                endpoint: '/api/v1/enterprise/export/visits',
                startDate: thirtyDaysAgo,
                endDate: today,
                downloading: false,
                lastDownloaded: null,
                iconBg: 'bg-blue-100',
                iconText: 'text-blue-600',
                iconPath: 'M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10'
            },
            {
                key: 'leaderboard',
                title: 'Leaderboard',
                description: 'Technician performance rankings with KPI scores',
                endpoint: '/api/v1/enterprise/export/leaderboard',
                startDate: thirtyDaysAgo,
                endDate: today,
                downloading: false,
                lastDownloaded: null,
                iconBg: 'bg-orange-100',
                iconText: 'text-orange-600',
                iconPath: 'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z'
            },
            {
                key: 'complaints',
                title: 'Complaints',
                description: 'Customer complaints with status, category, and resolution details',
                endpoint: '/api/v1/enterprise/export/complaints',
                startDate: thirtyDaysAgo,
                endDate: today,
                downloading: false,
                lastDownloaded: null,
                iconBg: 'bg-red-100',
                iconText: 'text-red-600',
                iconPath: 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z'
            },
            {
                key: 'contracts',
                title: 'Contracts',
                description: 'Active and expiring contracts with renewal status',
                endpoint: '/api/v1/enterprise/export/contracts',
                startDate: thirtyDaysAgo,
                endDate: today,
                downloading: false,
                lastDownloaded: null,
                iconBg: 'bg-green-100',
                iconText: 'text-green-600',
                iconPath: 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z'
            },
            {
                key: 'csat',
                title: 'CSAT',
                description: 'Customer satisfaction scores and survey responses',
                endpoint: '/api/v1/enterprise/export/csat',
                startDate: thirtyDaysAgo,
                endDate: today,
                downloading: false,
                lastDownloaded: null,
                iconBg: 'bg-purple-100',
                iconText: 'text-purple-600',
                iconPath: 'M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z'
            },
            {
                key: 'audit_log',
                title: 'Audit Log',
                description: 'System audit trail with user actions and timestamps',
                endpoint: '/api/v1/enterprise/export/audit-log',
                startDate: thirtyDaysAgo,
                endDate: today,
                downloading: false,
                lastDownloaded: null,
                iconBg: 'bg-gray-100',
                iconText: 'text-gray-600',
                iconPath: 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01'
            }
        ],

        async init() {
            await this.loadServerExports();
        },

        async loadServerExports() {
            this.loading = true;
            try {
                const resp = await authenticatedFetch('/api/v1/enterprise/export');
                if (resp.ok) {
                    const data = await resp.json();
                    this.serverExports = (data.exports || []).filter(
                        se => !this.exports.find(e => e.key === se.key)
                    );
                }
            } catch (e) { console.error('Failed to load exports:', e); }
            this.loading = false;
        },

        applyGlobalDates() {
            this.exports.forEach(exp => {
                exp.startDate = this.globalStart;
                exp.endDate = this.globalEnd;
            });
        },

        async downloadExport(exp) {
            exp.downloading = true;
            exp.lastDownloaded = null;
            try {
                const url = `${exp.endpoint}?start_date=${exp.startDate}&end_date=${exp.endDate}&format=csv`;
                const resp = await authenticatedFetch(url);
                if (resp.ok) {
                    const blob = await resp.blob();
                    const filename = `${exp.key}_${exp.startDate}_${exp.endDate}.csv`;
                    this.triggerDownload(blob, filename);
                    exp.lastDownloaded = new Date().toLocaleTimeString();
                } else {
                    console.error('Export failed:', resp.status);
                    alert('Export failed. Please try again.');
                }
            } catch (e) {
                console.error('Download error:', e);
                alert('Download failed. Please check your connection.');
            }
            exp.downloading = false;
        },

        async downloadServerExport(se) {
            try {
                const url = se.endpoint || `/api/v1/enterprise/export/${se.key}?format=csv`;
                const resp = await authenticatedFetch(url);
                if (resp.ok) {
                    const blob = await resp.blob();
                    this.triggerDownload(blob, `${se.key}.csv`);
                }
            } catch (e) { console.error(e); }
        },

        triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    };
}
</script>
{% endblock %}
