<script>
const API = '/api/v1';

function app() {
  return {
    // Splash
    splashVisible: true,

    // Auth
    user: null,
    loginForm: { login: '', password: '' },
    loginLoading: false,
    loginError: '',
    showPassword: false,
    showLoginManual: false,
    fastLoginTarget: null,
    pinMode: false,
    pinCode: '',
    pinTarget: null,

    // Customer detail
    activeCustomer: null,
    customerDetail: null,
    customerDetailLoading: false,

    // Tutorial
    tutorialActive: false,
    tutorialStep: 0,
    tutorialCardTop: '30%',
    tutorialArrowDir: 'up',
    tutorialSteps: [
      { title: 'Selamat Datang!', desc: 'Ini adalah aplikasi mobile Safe & Care untuk manajemen kunjungan teknisi. Mari kita pelajari fitur-fiturnya.', icon: '👋', iconBg: 'bg-orange-50' },
      { title: 'Beranda Dashboard', desc: 'Di halaman utama, Anda bisa melihat ringkasan kunjungan hari ini, statistik, dan progres pekerjaan real-time.', icon: '📊', iconBg: 'bg-blue-50' },
      { title: 'Check In & Check Out', desc: 'Saat tiba di lokasi pelanggan, tekan "Check In" untuk catat waktu & GPS. Selesai kerja? Tekan "Check Out" dengan catatan & foto bukti.', icon: '📍', iconBg: 'bg-green-50' },
      { title: 'Jadwal Kunjungan', desc: 'Tab Jadwal menampilkan peta perjalanan Anda seperti peta Dora! Lihat rute harian dengan kalender yang mudah dipahami.', icon: '🗺️', iconBg: 'bg-purple-50' },
      { title: 'Foto & Laporan', desc: 'Upload foto bukti pengerjaan dari kamera atau galeri. Semua terekam otomatis di tab Laporan untuk audit.', icon: '📸', iconBg: 'bg-yellow-50' },
      { title: 'Menu & Navigasi', desc: 'Tekan tombol orange di tengah bawah untuk membuka menu lengkap. Navigasi cepat juga tersedia di bar bawah.', icon: '🧭', iconBg: 'bg-red-50' },
      { title: 'Perbedaan Hak Akses', desc: 'Admin: akses penuh. Supervisor: pantau tim & approval. Teknisi: check in/out, foto, jadwal pribadi. Pilih akun sesuai peran Anda!', icon: '🔐', iconBg: 'bg-indigo-50' },
      { title: 'Siap Digunakan!', desc: 'Anda sudah siap menggunakan aplikasi ini. Pilih akun di halaman login untuk memulai. Selamat bekerja!', icon: '🚀', iconBg: 'bg-primary/10' }
    ],

    // Role feature comparison
    roleFeatures: [
      { name: 'Check In / Check Out', tech: true, spv: false, admin: false },
      { name: 'Upload Foto Bukti', tech: true, spv: false, admin: false },
      { name: 'GPS Tracking', tech: true, spv: true, admin: true },
      { name: 'Jadwal Pribadi', tech: true, spv: true, admin: true },
      { name: 'Lihat Semua Teknisi', tech: false, spv: true, admin: true },
      { name: 'Approval Kunjungan', tech: false, spv: true, admin: true },
      { name: 'Laporan Tim', tech: false, spv: true, admin: true },
      { name: 'Manajemen User', tech: false, spv: false, admin: true },
      { name: 'Dashboard Executive', tech: false, spv: false, admin: true },
      { name: 'Export Data', tech: false, spv: false, admin: true },
    ],

    // Tabs & menu
    tab: 'home',
    menuOpen: false,

    // Dashboard
    stats: { total_visits_today:0, checked_in_now:0, completed_today:0, pending_approvals:0, total_customers:0 },
    dashLoading: false,

    // Visits
    visits: [],
    visitsLoading: false,
    visitFilter: 'all',
    activeVisit: null,
    visitRemarks: '',
    visitPhotos: [],
    actionLoading: false,

    // Photos gallery
    visitPhotoGallery: [],
    visitPhotoLoading: false,
    photoViewerOpen: false,
    photoViewerUrl: '',

    // Pull to refresh
    pullRefreshing: false,

    // GPS
    gpsLocation: null,
    gpsLoading: false,

    // Customers
    customers: [],
    customersLoading: false,
    customerSearch: '',

    // Approvals
    approvals: [],

    // Performance
    perfData: null,
    perfLoading: false,

    // Complaints
    complaintsList: [],
    complaintsLoading: false,
    complaintStats: {},
    complaintFilter: 'open,in_progress',
    activeComplaint: null,
    showComplaintForm: false,
    complaintSubmitting: false,
    newComplaint: { customer_id:null, customerSearch:'', customerResults:[], title:'', description:'', severity:'medium', category:'service', reported_by:'' },

    // Toast
    toast: null,

    // Schedule (Jadwal)
    calSelectedDate: new Date().toISOString().slice(0,10),
    calWeekStart: null, // set in init
    scheduleVisits: [],
    scheduleLoading: false,
    scheduleDatesWithVisits: [],

    get isSupervisor() {
      return this.user && ['supervisor','koordinator','admin'].includes(this.user.role);
    },

    get todayLabel() {
      return new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    },

    get greetingText() {
      const h = new Date().getHours();
      const g = h < 11 ? 'Selamat Pagi' : h < 15 ? 'Selamat Siang' : h < 18 ? 'Selamat Sore' : 'Selamat Malam';
      return g + ',';
    },

    get filteredVisits() {
      if (this.visitFilter === 'all') return this.visits;
      return this.visits.filter(v => v.status === this.visitFilter);
    },

    get nextVisit() {
      return this.visits.find(v => v.status === 'SCHEDULED' || v.status === 'IN_PROGRESS') || null;
    },

    get calWeekDays() {
      const start = this.calWeekStart || new Date();
      const days = [];
      const dayNames = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
      const today = new Date().toISOString().slice(0,10);
      for (let i = 0; i < 7; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        const iso = d.toISOString().slice(0,10);
        days.push({
          iso,
          date: d.getDate(),
          dayName: dayNames[d.getDay()],
          isToday: iso === today,
          hasVisits: this.scheduleDatesWithVisits.includes(iso)
        });
      }
      return days;
    },

    get calMonthLabel() {
      const d = this.calWeekStart || new Date();
      const mid = new Date(d);
      mid.setDate(d.getDate() + 3);
      return mid.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
    },

    get pageTitle() {
      const titles = { home:'Beranda', visits:'Aktivitas', schedule:'Jadwal', customers:'Pelanggan', approvals:'Approval', reports:'Laporan', complaints:'Komplain', profile:'Profil' };
      return titles[this.tab] || 'Beranda';
    },

    // ── Navigation ──
    navigateTo(page) {
      this.tab = page;
      this.menuOpen = false;
      if (page === 'home') this.loadDashboard();
      if (page === 'visits') this.loadVisits();
      if (page === 'customers' && this.customers.length === 0) this.loadCustomers();
      if (page === 'approvals') this.loadApprovals();
      if (page === 'schedule') this.loadSchedule();
      if (page === 'reports') { this.loadVisits(); if (!this.perfData) this.loadPerformance(); }
      if (page === 'complaints') this.loadComplaints();
    },

    navigateQuick(page) {
      this.tab = page;
      if (page === 'home') this.loadDashboard();
      if (page === 'visits') this.loadVisits();
      if (page === 'customers' && this.customers.length === 0) this.loadCustomers();
      if (page === 'schedule') this.loadSchedule();
    },

    // ── Pull to Refresh ──
    async pullRefresh() {
      if (this.pullRefreshing) return;
      this.pullRefreshing = true;
      try {
        if (this.tab === 'home') { await this.loadDashboard(); await this.loadVisits(); }
        else if (this.tab === 'visits') await this.loadVisits();
        else if (this.tab === 'schedule') await this.loadSchedule();
        else if (this.tab === 'customers') await this.loadCustomers();
        else if (this.tab === 'approvals') await this.loadApprovals();
        else if (this.tab === 'reports') { await this.loadVisits(); await this.loadPerformance(); }
        this.showToast('Data diperbarui', 'success');
      } catch(e) {}
      this.pullRefreshing = false;
    },

    setupPullToRefresh() {
      const main = document.querySelector('main');
      if (!main) return;
      let startY = 0;
      let pulling = false;
      main.addEventListener('touchstart', (e) => {
        if (main.scrollTop === 0) { startY = e.touches[0].clientY; pulling = true; }
      }, { passive: true });
      main.addEventListener('touchmove', (e) => {
        if (!pulling) return;
        const dy = e.touches[0].clientY - startY;
        if (dy > 80 && main.scrollTop === 0) { pulling = false; this.pullRefresh(); }
      }, { passive: true });
      main.addEventListener('touchend', () => { pulling = false; }, { passive: true });
    },

    // ── Init ──
    init() {
      // Init calendar week (Monday start)
      const today = new Date();
      const dow = today.getDay();
      const mondayOffset = dow === 0 ? -6 : 1 - dow;
      this.calWeekStart = new Date(today);
      this.calWeekStart.setDate(today.getDate() + mondayOffset);
      this.calWeekStart.setHours(0,0,0,0);

      const token = localStorage.getItem('sc_access_token');
      const stored = localStorage.getItem('sc_user');
      if (token && stored) {
        try { this.user = JSON.parse(stored); } catch(e) {}
        if (this.user) {
          this.loadDashboard();
          this.loadVisits();
          if (this.isSupervisor) this.loadApprovals();
        }
      }
      // Dismiss splash
      setTimeout(() => {
        const splash = document.getElementById('splash');
        if (splash) splash.classList.add('hide');
        setTimeout(() => {
          this.splashVisible = false;
          if (splash) splash.style.display = 'none';
          this.setupPullToRefresh();
        }, 400);
      }, 1500);
    },

    // ── Auth ──
    async doLogin() {
      this.loginError = '';
      this.loginLoading = true;
      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(this.loginForm)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login gagal');
        localStorage.setItem('sc_access_token', data.access_token);
        localStorage.setItem('sc_refresh_token', data.refresh_token);
        localStorage.setItem('sc_user', JSON.stringify(data.user));
        this.user = data.user;
        this.loadDashboard();
        this.loadVisits();
        if (this.isSupervisor) this.loadApprovals();
      } catch(e) {
        this.loginError = e.message;
      } finally {
        this.loginLoading = false;
      }
    },

    doLogout() {
      localStorage.removeItem('sc_access_token');
      localStorage.removeItem('sc_refresh_token');
      localStorage.removeItem('sc_user');
      this.user = null;
      this.tab = 'home';
      this.menuOpen = false;
    },

    // ── PIN Login ──
    startPinLogin(role) {
      if (this.fastLoginTarget) return;
      this.pinTarget = role;
      this.pinCode = '';
      this.loginError = '';
    },

    pinPress(n) {
      if (this.pinCode.length >= 4) return;
      this.pinCode += n;
      if (this.pinCode.length === 4) {
        if (this.pinCode === '1234') {
          this.loginError = '';
          this.fastLogin(this.pinTarget);
        } else {
          this.loginError = 'Kode PIN salah!';
          setTimeout(() => { this.pinCode = ''; }, 600);
        }
      }
    },

    // ── Fast Login ──
    async fastLogin(role) {
      if (this.fastLoginTarget) return;
      const accounts = {
        admin: { login: 'admin@sanocare.work', password: 'SanoCare2026!' },
        supervisor: { login: 'alexander.laurensy@sanotama.net', password: 'SanoCare2026!' },
        technician: { login: 'bustomi@gmail.com', password: 'SanoCare2026!' }
      };
      const acct = accounts[role];
      if (!acct) return;
      this.fastLoginTarget = role;
      this.loginError = '';
      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(acct)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login gagal');
        localStorage.setItem('sc_access_token', data.access_token);
        localStorage.setItem('sc_refresh_token', data.refresh_token);
        localStorage.setItem('sc_user', JSON.stringify(data.user));
        this.user = data.user;
        this.pinTarget = null;
        this.pinCode = '';
        this.loadDashboard();
        this.loadVisits();
        if (this.isSupervisor) this.loadApprovals();
      } catch(e) {
        this.loginError = e.message;
      } finally {
        this.fastLoginTarget = null;
      }
    },

    // ── Tutorial ──
    startTutorial() {
      this.tutorialActive = true;
      this.tutorialStep = 0;
      this.updateTutorialPosition();
    },

    tutorialNext() {
      if (this.tutorialStep >= this.tutorialSteps.length - 1) {
        this.endTutorial();
      } else {
        this.tutorialStep++;
        this.updateTutorialPosition();
      }
    },

    endTutorial() {
      this.tutorialActive = false;
      this.tutorialStep = 0;
    },

    updateTutorialPosition() {
      const positions = ['25%','20%','30%','25%','30%','35%','20%','25%'];
      this.tutorialCardTop = positions[this.tutorialStep] || '25%';
      this.tutorialArrowDir = this.tutorialStep < 4 ? 'up' : 'down';
    },

    // ── API helper ──
    async apiFetch(path, opts={}) {
      const token = localStorage.getItem('sc_access_token');
      const headers = { ...opts.headers, 'Authorization': `Bearer ${token}` };
      if (!(opts.body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
      }
      let res = await fetch(`${API}${path}`, { ...opts, headers });
      if (res.status === 401) {
        const refreshed = await this.refreshToken();
        if (refreshed) {
          headers['Authorization'] = `Bearer ${localStorage.getItem('sc_access_token')}`;
          res = await fetch(`${API}${path}`, { ...opts, headers });
        } else {
          this.doLogout();
          return null;
        }
      }
      return res;
    },

    async refreshToken() {
      const rt = localStorage.getItem('sc_refresh_token');
      if (!rt) return false;
      try {
        const res = await fetch(`${API}/auth/refresh`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({refresh_token: rt})
        });
        if (!res.ok) return false;
        const data = await res.json();
        localStorage.setItem('sc_access_token', data.access_token);
        localStorage.setItem('sc_refresh_token', data.refresh_token);
        return true;
      } catch(e) { return false; }
    },

    // ── Dashboard ──
    async loadDashboard() {
      this.dashLoading = true;
      const res = await this.apiFetch('/mobile/dashboard');
      if (res?.ok) this.stats = await res.json();
      this.dashLoading = false;
    },

    // ── Visits ──
    async loadVisits() {
      this.visitsLoading = true;
      const res = await this.apiFetch('/mobile/visits/today');
      if (res?.ok) this.visits = await res.json();
      this.visitsLoading = false;
    },

    openVisit(v) {
      this.activeVisit = {...v};
      this.visitRemarks = '';
      this.visitPhotos = [];
      this.visitPhotoGallery = [];
      this.gpsLocation = null;
      this.captureGPS();
      this.loadVisitPhotos(v.road_plan_id);
    },

    async loadVisitPhotos(roadPlanId) {
      this.visitPhotoLoading = true;
      try {
        const res = await this.apiFetch(`/mobile/visits/${roadPlanId}/photos`);
        if (res?.ok) {
          const data = await res.json();
          this.visitPhotoGallery = data.photos || [];
        }
      } catch(e) {}
      this.visitPhotoLoading = false;
    },

    // ── Schedule ──
    async loadSchedule() {
      this.scheduleLoading = true;
      const res = await this.apiFetch(`/mobile/visits/schedule?date=${this.calSelectedDate}`);
      if (res?.ok) this.scheduleVisits = await res.json();
      this.scheduleLoading = false;
    },

    selectCalDate(iso) {
      this.calSelectedDate = iso;
      this.loadSchedule();
    },

    calPrevWeek() {
      const d = new Date(this.calWeekStart);
      d.setDate(d.getDate() - 7);
      this.calWeekStart = d;
    },

    calNextWeek() {
      const d = new Date(this.calWeekStart);
      d.setDate(d.getDate() + 7);
      this.calWeekStart = d;
    },

    formatDateFull(iso) {
      if (!iso) return '';
      const d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    },

    calcDuration(startIso, endIso) {
      if (!startIso || !endIso) return '';
      const ms = new Date(endIso) - new Date(startIso);
      const mins = Math.round(ms / 60000);
      if (mins < 60) return mins + ' menit';
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return h + 'j ' + m + 'm';
    },

    // ── Google Maps Navigation ──
    openGoogleMaps(visit) {
      // Prefer lat/lng if available, fall back to address search
      if (visit.latitude && visit.longitude) {
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${visit.latitude},${visit.longitude}`, '_blank');
      } else if (visit.customer_address) {
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(visit.customer_address)}`, '_blank');
      } else if (visit.address) {
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(visit.address)}`, '_blank');
      } else {
        this.showToast('Alamat tidak tersedia', 'error');
      }
    },

    // ── GPS ──
    async captureGPS() {
      if (!navigator.geolocation) return;
      this.gpsLoading = true;
      try {
        const pos = await new Promise((ok, fail) =>
          navigator.geolocation.getCurrentPosition(ok, fail, {
            enableHighAccuracy: true, timeout: 15000, maximumAge: 0
          })
        );
        this.gpsLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy };
      } catch(e) {
        this.gpsLocation = null;
      }
      this.gpsLoading = false;
    },

    // ── Photos ──
    addPhoto(ev) {
      const file = ev.target.files[0];
      if (file) this.visitPhotos.push({ file, url: URL.createObjectURL(file) });
      ev.target.value = '';
    },
    addPhotos(ev) {
      for (const file of ev.target.files) this.visitPhotos.push({ file, url: URL.createObjectURL(file) });
      ev.target.value = '';
    },

    async uploadPhotos(roadPlanId, stage) {
      if (this.visitPhotos.length === 0) return;
      const fd = new FormData();
      fd.append('stage', stage);
      for (const p of this.visitPhotos) fd.append('photos', p.file);
      await this.apiFetch(`/mobile/visits/${roadPlanId}/photos`, {method:'POST', body: fd});
    },

    // ── Check-in ──
    async doCheckIn() {
      if (!this.gpsLocation) {
        await this.captureGPS();
        if (!this.gpsLocation && !confirm('GPS tidak tersedia. Lanjutkan tanpa lokasi?')) return;
      }
      this.actionLoading = true;
      try {
        const body = {};
        if (this.gpsLocation) { body.latitude = this.gpsLocation.lat; body.longitude = this.gpsLocation.lng; }
        const res = await this.apiFetch(`/mobile/visits/${this.activeVisit.road_plan_id}/checkin`, {
          method:'POST', body: JSON.stringify(body)
        });
        if (!res?.ok) { const e = await res.json(); throw new Error(e.error); }
        await this.uploadPhotos(this.activeVisit.road_plan_id, 'checkin');
        this.showToast('Check-in berhasil!', 'success');
        this.activeVisit = null;
        this.loadVisits();
        this.loadDashboard();
      } catch(e) {
        this.showToast(e.message || 'Gagal check-in', 'error');
      }
      this.actionLoading = false;
    },

    // ── Check-out ──
    async doCheckOut() {
      if (!this.visitRemarks.trim()) { this.showToast('Catatan kunjungan wajib diisi', 'error'); return; }
      if (!this.gpsLocation) await this.captureGPS();
      this.actionLoading = true;
      try {
        const body = { remarks: this.visitRemarks.trim() };
        if (this.gpsLocation) { body.latitude = this.gpsLocation.lat; body.longitude = this.gpsLocation.lng; }
        const res = await this.apiFetch(`/mobile/visits/${this.activeVisit.road_plan_id}/checkout`, {
          method:'POST', body: JSON.stringify(body)
        });
        if (!res?.ok) { const e = await res.json(); throw new Error(e.error); }
        await this.uploadPhotos(this.activeVisit.road_plan_id, 'checkout');
        this.showToast('Check-out berhasil!', 'success');
        this.activeVisit = null;
        this.loadVisits();
        this.loadDashboard();
      } catch(e) {
        this.showToast(e.message || 'Gagal check-out', 'error');
      }
      this.actionLoading = false;
    },

    // ── Customers ──
    async loadCustomers() {
      this.customersLoading = true;
      const q = this.customerSearch ? `?q=${encodeURIComponent(this.customerSearch)}` : '';
      const res = await this.apiFetch(`/mobile/customers${q}`);
      if (res?.ok) this.customers = await res.json();
      this.customersLoading = false;
    },

    // ── Customer Detail ──
    async openCustomerDetail(c) {
      this.activeCustomer = c;
      this.customerDetail = null;
      this.customerDetailLoading = true;
      const res = await this.apiFetch(`/mobile/customers/${c.id}`);
      if (res?.ok) this.customerDetail = await res.json();
      this.customerDetailLoading = false;
    },

    closeCustomerDetail() {
      this.activeCustomer = null;
      this.customerDetail = null;
    },

    // ── Approvals ──
    async loadApprovals() {
      const res = await this.apiFetch('/mobile/approvals');
      if (res?.ok) this.approvals = await res.json();
    },
    async doApprove(id) {
      await this.apiFetch(`/mobile/approvals/${id}/approve`, {method:'POST'});
      this.showToast('Approved!', 'success');
      this.loadApprovals();
    },
    async doReject(id) {
      const reason = prompt('Alasan penolakan:');
      if (reason === null) return;
      await this.apiFetch(`/mobile/approvals/${id}/reject`, {
        method:'POST', body: JSON.stringify({reason})
      });
      this.showToast('Rejected', 'error');
      this.loadApprovals();
    },

    // ── Complaints ──
    async loadComplaints() {
      this.complaintsLoading = true;
      try {
        const res = await this.apiFetch(`/enterprise/complaints?status=${this.complaintFilter}`);
        if (res?.ok) {
          const data = await res.json();
          this.complaintsList = data.complaints || [];
          this.complaintStats = data.stats || {};
        }
      } catch(e) {}
      this.complaintsLoading = false;
    },

    openComplaint(ct) {
      this.activeComplaint = {...ct};
    },

    async updateComplaintStatus(id, status) {
      try {
        const res = await this.apiFetch(`/enterprise/complaints/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ status })
        });
        if (res?.ok) {
          this.showToast('Status diperbarui', 'success');
          this.activeComplaint.status = status;
          this.loadComplaints();
        }
      } catch(e) { this.showToast('Gagal update', 'error'); }
    },

    resolveComplaintPrompt(id) {
      const resolution = prompt('Resolusi / tindakan yang dilakukan:');
      if (resolution === null) return;
      this.updateComplaintResolve(id, resolution);
    },

    async updateComplaintResolve(id, resolution) {
      try {
        const res = await this.apiFetch(`/enterprise/complaints/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ status: 'resolved', resolution })
        });
        if (res?.ok) {
          this.showToast('Komplain diselesaikan', 'success');
          this.activeComplaint = null;
          this.loadComplaints();
        }
      } catch(e) { this.showToast('Gagal update', 'error'); }
    },

    async searchComplaintCustomer() {
      const q = this.newComplaint.customerSearch;
      if (q.length < 2) { this.newComplaint.customerResults = []; return; }
      try {
        const res = await this.apiFetch(`/enterprise/complaints/customers/search?q=${encodeURIComponent(q)}`);
        if (res?.ok) this.newComplaint.customerResults = await res.json();
      } catch(e) {}
    },

    async submitComplaint() {
      if (!this.newComplaint.customer_id) { this.showToast('Pilih pelanggan', 'error'); return; }
      if (!this.newComplaint.title.trim()) { this.showToast('Judul wajib diisi', 'error'); return; }

      this.complaintSubmitting = true;
      try {
        const res = await this.apiFetch('/enterprise/complaints', {
          method: 'POST',
          body: JSON.stringify({
            customer_id: this.newComplaint.customer_id,
            title: this.newComplaint.title,
            description: this.newComplaint.description,
            severity: this.newComplaint.severity,
            category: this.newComplaint.category,
            reported_by: this.newComplaint.reported_by,
          })
        });
        if (res?.ok) {
          this.showToast('Komplain berhasil disimpan', 'success');
          this.showComplaintForm = false;
          this.newComplaint = { customer_id:null, customerSearch:'', customerResults:[], title:'', description:'', severity:'medium', category:'service', reported_by:'' };
          this.loadComplaints();
        } else {
          const err = await res.json();
          this.showToast(err.error || 'Gagal menyimpan', 'error');
        }
      } catch(e) { this.showToast('Gagal menyimpan', 'error'); }
      this.complaintSubmitting = false;
    },

    // ── WhatsApp Share ──
    shareToWhatsApp(type) {
      let text = '';
      const today = new Date().toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

      if (type === 'daily') {
        const completed = this.visits.filter(v => v.status === 'COMPLETED');
        const inProgress = this.visits.filter(v => v.status === 'IN_PROGRESS');
        const scheduled = this.visits.filter(v => v.status === 'SCHEDULED');

        text = `*Safe & Care - Laporan Harian*\n`;
        text += `${today}\n`;
        text += `Teknisi: ${this.user.full_name}\n\n`;
        text += `📊 *Ringkasan:*\n`;
        text += `✅ Selesai: ${completed.length}\n`;
        text += `🔄 Berjalan: ${inProgress.length}\n`;
        text += `📋 Terjadwal: ${scheduled.length}\n`;
        text += `Total: ${this.visits.length} kunjungan\n\n`;

        if (completed.length > 0) {
          text += `📝 *Detail Selesai:*\n`;
          completed.forEach((v, i) => {
            text += `${i+1}. ${v.customer_name}`;
            if (v.check_in && v.check_out) text += ` (${this.formatTime(v.check_in)}-${this.formatTime(v.check_out)})`;
            text += `\n`;
          });
          text += `\n`;
        }

        if (inProgress.length > 0) {
          text += `⚠️ *Sedang Dikerjakan:*\n`;
          inProgress.forEach(v => { text += `• ${v.customer_name}\n`; });
          text += `\n`;
        }

        if (scheduled.length > 0) {
          text += `📌 *Belum Dikunjungi:*\n`;
          scheduled.forEach(v => { text += `• ${v.customer_name}\n`; });
          text += `\n`;
        }

        text += `_Dikirim dari SNC Mobile_`;
      } else if (type === 'performance' && this.perfData) {
        text = `*Safe & Care - Performa*\n`;
        text += `${this.user.full_name}\n\n`;
        text += `📊 *Minggu Ini:*\n`;
        text += `Selesai: ${this.perfData.week.completed || 0}/${this.perfData.week.planned || 0} (${this.perfData.week.completion_rate}%)\n\n`;
        text += `📈 *${this.perfData.month.label}:*\n`;
        text += `Selesai: ${this.perfData.month.completed || 0}/${this.perfData.month.planned || 0} (${this.perfData.month.completion_rate}%)\n`;
        text += `Hari kerja: ${this.perfData.month.days_worked || 0}\n\n`;
        text += `_Dikirim dari SNC Mobile_`;
      }

      if (text) {
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      }
    },

    // ── Performance ──
    async loadPerformance() {
      this.perfLoading = true;
      try {
        const res = await this.apiFetch('/mobile/my-performance');
        if (res?.ok) this.perfData = await res.json();
      } catch(e) {}
      this.perfLoading = false;
    },

    // ── Helpers ──
    formatTime(iso) {
      if (!iso) return '--:--';
      const d = new Date(iso);
      return d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
    },

    showToast(msg, type='success') {
      this.toast = {msg, type};
      setTimeout(()=>{ this.toast = null; }, 3000);
    }
  };
}
</script>
