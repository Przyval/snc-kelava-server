<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F97316">
<meta name="mobile-web-app-capable" content="yes">
<title>SNC Mobile</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🛡️</text></svg>">
<link rel="apple-touch-icon" href="/enterprise/static/img/logo_snc.webp">
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3/dist/cdn.min.js"></script>
<style>
  [x-cloak]{display:none!important}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
  .safe-bottom{padding-bottom:env(safe-area-inset-bottom,0)}
  .safe-top{padding-top:env(safe-area-inset-top,0)}

  /* Splash screen — matches enterprise dashboard dark theme */
  #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#0F172A 0%,#1E293B 100%);transition:opacity .5s ease,transform .5s ease;overflow:hidden}
  #splash.hide{opacity:0;transform:scale(1.05);pointer-events:none}
  #splash .splash-grid{position:absolute;inset:0;opacity:.06;
    background-image:linear-gradient(rgba(255,255,255,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.4) 1px,transparent 1px);
    background-size:40px 40px}
  #splash .logo-ring{width:100px;height:100px;border-radius:24px;background:white;display:flex;align-items:center;justify-content:center;
    box-shadow:0 20px 60px rgba(0,0,0,.4);animation:splashPulse 2.5s ease-in-out infinite;position:relative;z-index:2}
  #splash .logo-ring img{width:64px;height:64px;object-fit:contain}
  @keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
  #splash .splash-title{color:white;font-size:2rem;font-weight:800;margin-top:24px;letter-spacing:-.03em;position:relative;z-index:2}
  #splash .splash-sub{color:#94A3B8;font-size:.85rem;margin-top:4px;font-weight:500;letter-spacing:.02em;position:relative;z-index:2}
  #splash .splash-bar{width:160px;height:3px;background:rgba(255,255,255,.08);border-radius:4px;margin-top:36px;overflow:hidden;position:relative;z-index:2}
  #splash .splash-bar-fill{height:100%;width:0;background:linear-gradient(90deg,#F97316,#FB923C);border-radius:4px;
    animation:splashLoad 1.4s ease-in-out forwards}
  @keyframes splashLoad{0%{width:0}60%{width:70%}100%{width:100%}}
  #splash .splash-dots{display:flex;gap:6px;margin-top:16px;position:relative;z-index:2}
  #splash .splash-dots span{width:5px;height:5px;border-radius:50%;background:#F97316;opacity:.3;animation:dotPulse .8s ease-in-out infinite}
  #splash .splash-dots span:nth-child(2){animation-delay:.15s}
  #splash .splash-dots span:nth-child(3){animation-delay:.3s}
  @keyframes dotPulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
  #splash .splash-secure{position:absolute;bottom:40px;display:flex;align-items:center;gap:8px;color:#475569;font-size:.7rem;font-weight:500;z-index:2}
  #splash .splash-secure .dot{width:6px;height:6px;border-radius:50%;background:#F97316}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Animations */
  .slide-up{animation:slideUp .3s cubic-bezier(.16,1,.3,1)}
  @keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
  .slide-in-right{animation:slideInRight .3s cubic-bezier(.16,1,.3,1)}
  @keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
  .fade-in{animation:fadeIn .25s ease-out}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .scale-in{animation:scaleIn .2s cubic-bezier(.16,1,.3,1)}
  @keyframes scaleIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}

  /* Skeleton shimmer */
  .skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;
    animation:shimmer 1.5s infinite;border-radius:8px}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* Button press */
  .btn-press{transition:transform .1s ease}
  .btn-press:active{transform:scale(.96)}

  /* Bottom menu panel */
  .menu-panel{transform:translateY(100%);transition:transform .35s cubic-bezier(.16,1,.3,1)}
  .menu-panel.open{transform:translateY(0)}
  .menu-backdrop{background:rgba(0,0,0,0);transition:background .3s ease;pointer-events:none}
  .menu-backdrop.open{background:rgba(0,0,0,.35);pointer-events:auto}

  /* Progress stepper */
  .step-dot{width:12px;height:12px;border-radius:50%;border:2px solid #d1d5db;transition:all .2s}
  .step-dot.active{background:#F97316;border-color:#F97316;box-shadow:0 0 0 3px rgba(249,115,22,.2)}
  .step-dot.done{background:#43A047;border-color:#43A047}
  .step-line{height:2px;flex:1;background:#e5e7eb;transition:background .2s}
  .step-line.done{background:#43A047}
  .step-line.active{background:linear-gradient(90deg,#43A047,#F97316)}

  /* Journey path (Dora map style) */
  .journey-path{position:relative;padding-left:32px}
  .journey-path::before{content:'';position:absolute;left:13px;top:20px;bottom:20px;width:3px;
    background:repeating-linear-gradient(to bottom,#F97316 0,#F97316 6px,transparent 6px,transparent 11px);border-radius:2px}
  .journey-stop{position:relative;padding:5px 0}
  .journey-stop .stop-dot{position:absolute;left:-32px;top:10px;width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;z-index:2;border:2px solid white;box-shadow:0 2px 4px rgba(0,0,0,.1)}
  .journey-stop .stop-number{font-size:9px;font-weight:800;color:white}
  .journey-stop.completed .stop-dot{background:#43A047}
  .journey-stop.active .stop-dot{background:#F97316;animation:pulseStop 2s infinite}
  .journey-stop.pending .stop-dot{background:#d1d5db}
  @keyframes pulseStop{0%,100%{box-shadow:0 2px 6px rgba(0,0,0,.1)}50%{box-shadow:0 0 0 8px rgba(249,115,22,.2)}}

  /* Calendar — responsive, no overflow */
  .cal-day{flex:1;min-width:0;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:12px;transition:all .15s;cursor:pointer}
  .cal-day:active{transform:scale(.94)}
  .cal-day.today{border:2px solid #F97316}
  .cal-day.selected{background:#F97316;color:white;border-color:#F97316}
  .cal-day.selected .cal-weekday{color:rgba(255,255,255,.7)}
  .cal-day .cal-weekday{font-size:9px;font-weight:600;color:#9ca3af;text-transform:uppercase}
  .cal-day .cal-date{font-size:15px;font-weight:700;line-height:1.2}
  .cal-day.has-visits::after{content:'';width:4px;height:4px;background:#F97316;border-radius:50%;margin-top:1px}
  .cal-day.selected.has-visits::after{background:white}

  /* Toast */
  .toast-slide{animation:toastIn .3s cubic-bezier(.16,1,.3,1)}
  @keyframes toastIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}

  input,textarea,select{font-size:16px!important}

  /* Fast login cards */
  .fast-card{transition:all .15s ease;border:2px solid transparent}
  .fast-card:active{transform:scale(.97)}
  .fast-card.logging{opacity:.6;pointer-events:none}
  .role-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    padding:2px 8px;border-radius:6px}

  /* Tutorial overlay */
  .tutorial-overlay{position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.7);backdrop-filter:blur(2px)}
  .tutorial-card{position:fixed;z-index:9999;background:white;border-radius:20px;padding:24px;max-width:340px;
    left:50%;transform:translateX(-50%);box-shadow:0 20px 60px rgba(0,0,0,.3);animation:tutorialPop .3s cubic-bezier(.16,1,.3,1)}
  @keyframes tutorialPop{from{transform:translateX(-50%) scale(.9);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
  .tutorial-dot{width:8px;height:8px;border-radius:50%;transition:all .2s}
  .tutorial-arrow{position:absolute;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent}
  .tutorial-arrow.up{border-bottom:10px solid white;top:-10px}
  .tutorial-arrow.down{border-top:10px solid white;bottom:-10px}

  /* Pull to refresh */
  .pull-indicator{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0;
    font-size:11px;font-weight:600;color:#F97316;overflow:hidden;transition:max-height .2s;max-height:0}
  .pull-indicator.show{max-height:50px}
  .pull-spinner{width:16px;height:16px;border:2px solid #FDBA74;border-top-color:#F97316;border-radius:50%;animation:spin .6s linear infinite}

  /* Photo viewer overlay */
  .photo-viewer{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center}
  .photo-viewer img{max-width:100%;max-height:90vh;object-fit:contain;border-radius:4px}
</style>
<script>
tailwind.config={theme:{extend:{colors:{primary:'#F97316','primary-dark':'#EA580C',success:'#43A047',warning:'#F59E0B',danger:'#E53935',accent:'#FB923C'}}}}
</script>
</head>
<body class="bg-gray-100 text-gray-800 max-w-lg mx-auto" x-data="app()" x-cloak>

<!-- ═══════════════════ SPLASH SCREEN (enterprise dark theme) ═══════════════════ -->
<div id="splash">
  <div class="splash-grid"></div>
  <div class="logo-ring">
    <img src="/enterprise/static/img/logo_snc.webp" alt="Safe & Care">
  </div>
  <div class="splash-title">Safe & Care</div>
  <div class="splash-sub">Enterprise Operations</div>
  <div class="splash-bar"><div class="splash-bar-fill"></div></div>
  <div class="splash-dots"><span></span><span></span><span></span></div>
  <div class="splash-secure">
    <div class="dot"></div>
    <span>Authorized Personnel Only</span>
  </div>
</div>

<!-- ═══════════════════ LOGIN SCREEN ═══════════════════ -->
<template x-if="!user && !splashVisible">
<div class="min-h-screen flex flex-col fade-in bg-gray-50">
  <div class="bg-gradient-to-br from-primary to-primary-dark pt-14 pb-10 px-8 text-center rounded-b-[2rem]">
    <div class="bg-white rounded-2xl p-3 w-20 h-20 flex items-center justify-center mx-auto mb-3 shadow-lg">
      <img src="/enterprise/static/img/logo_snc.webp" alt="SnC" class="w-14 h-14 object-contain">
    </div>
    <h1 class="text-2xl font-bold text-white">Safe & Care</h1>
    <p class="text-white/70 text-sm mt-1">Field Service Mobile</p>
  </div>

  <div class="flex-1 px-5 pt-5 pb-8 overflow-y-auto">

    <!-- ── FAST LOGIN SECTION ── -->
    <div class="mb-5 scale-in">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-bold text-gray-700 flex items-center gap-2">
          <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          Fast Login
        </h2>
        <button @click="showLoginManual=!showLoginManual" class="text-xs text-primary font-semibold btn-press">
          <span x-text="showLoginManual?'Fast Login':'Manual Login'"></span>
        </button>
      </div>

      <!-- Fast login cards -->
      <template x-if="!showLoginManual">
      <div class="space-y-3">
        <!-- Admin card -->
        <div @click="startPinLogin('admin')" class="fast-card bg-white rounded-2xl p-4 shadow-sm cursor-pointer hover:shadow-md"
          :class="fastLoginTarget==='admin'?'logging border-primary/40':pinTarget==='admin'?'border-primary/40':'border-transparent'">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-red-500 to-red-600 flex items-center justify-center flex-shrink-0 shadow-sm">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2">
                <span class="font-bold text-sm">Administrator</span>
                <span class="role-badge bg-red-50 text-red-600">Admin</span>
              </div>
              <p class="text-[11px] text-gray-400 mt-0.5">admin@sanocare.work</p>
            </div>
            <template x-if="fastLoginTarget==='admin'">
              <div class="w-5 h-5 border-2 border-primary/30 border-t-primary rounded-full animate-spin flex-shrink-0"></div>
            </template>
            <template x-if="fastLoginTarget!=='admin'">
              <svg class="w-5 h-5 text-gray-300 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </template>
          </div>
          <div class="mt-2.5 flex flex-wrap gap-1.5">
            <span class="text-[9px] bg-red-50 text-red-500 px-2 py-0.5 rounded-md font-medium">Semua Fitur</span>
            <span class="text-[9px] bg-red-50 text-red-500 px-2 py-0.5 rounded-md font-medium">Manajemen User</span>
            <span class="text-[9px] bg-red-50 text-red-500 px-2 py-0.5 rounded-md font-medium">Approval</span>
            <span class="text-[9px] bg-red-50 text-red-500 px-2 py-0.5 rounded-md font-medium">Lihat Semua Data</span>
          </div>
        </div>

        <!-- Supervisor card -->
        <div @click="startPinLogin('supervisor')" class="fast-card bg-white rounded-2xl p-4 shadow-sm cursor-pointer hover:shadow-md"
          :class="fastLoginTarget==='supervisor'?'logging border-blue-400/40':pinTarget==='supervisor'?'border-blue-400/40':'border-transparent'">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center flex-shrink-0 shadow-sm">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2">
                <span class="font-bold text-sm">Supervisor</span>
                <span class="role-badge bg-blue-50 text-blue-600">SPV</span>
              </div>
              <p class="text-[11px] text-gray-400 mt-0.5">Alexander Laurensy (Mgr SBY)</p>
            </div>
            <template x-if="fastLoginTarget==='supervisor'">
              <div class="w-5 h-5 border-2 border-blue-400/30 border-t-blue-500 rounded-full animate-spin flex-shrink-0"></div>
            </template>
            <template x-if="fastLoginTarget!=='supervisor'">
              <svg class="w-5 h-5 text-gray-300 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </template>
          </div>
          <div class="mt-2.5 flex flex-wrap gap-1.5">
            <span class="text-[9px] bg-blue-50 text-blue-500 px-2 py-0.5 rounded-md font-medium">Approval Visit</span>
            <span class="text-[9px] bg-blue-50 text-blue-500 px-2 py-0.5 rounded-md font-medium">Pantau Teknisi</span>
            <span class="text-[9px] bg-blue-50 text-blue-500 px-2 py-0.5 rounded-md font-medium">Laporan Tim</span>
            <span class="text-[9px] bg-blue-50 text-blue-500 px-2 py-0.5 rounded-md font-medium">Dashboard</span>
          </div>
        </div>

        <!-- Technician card -->
        <div @click="startPinLogin('technician')" class="fast-card bg-white rounded-2xl p-4 shadow-sm cursor-pointer hover:shadow-md"
          :class="fastLoginTarget==='technician'?'logging border-green-400/40':pinTarget==='technician'?'border-green-400/40':'border-transparent'">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-green-500 to-green-600 flex items-center justify-center flex-shrink-0 shadow-sm">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2">
                <span class="font-bold text-sm">Teknisi</span>
                <span class="role-badge bg-green-50 text-green-600">TECH</span>
              </div>
              <p class="text-[11px] text-gray-400 mt-0.5">Bustomi (Teknisi SBY)</p>
            </div>
            <template x-if="fastLoginTarget==='technician'">
              <div class="w-5 h-5 border-2 border-green-400/30 border-t-green-500 rounded-full animate-spin flex-shrink-0"></div>
            </template>
            <template x-if="fastLoginTarget!=='technician'">
              <svg class="w-5 h-5 text-gray-300 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </template>
          </div>
          <div class="mt-2.5 flex flex-wrap gap-1.5">
            <span class="text-[9px] bg-green-50 text-green-500 px-2 py-0.5 rounded-md font-medium">Check In/Out</span>
            <span class="text-[9px] bg-green-50 text-green-500 px-2 py-0.5 rounded-md font-medium">Foto Bukti</span>
            <span class="text-[9px] bg-green-50 text-green-500 px-2 py-0.5 rounded-md font-medium">Jadwal Pribadi</span>
            <span class="text-[9px] bg-green-50 text-green-500 px-2 py-0.5 rounded-md font-medium">GPS Lokasi</span>
          </div>
        </div>

        <!-- PIN Pad Overlay -->
        <template x-if="pinTarget">
        <div class="bg-white rounded-2xl p-5 shadow-md border-2 border-primary/20 scale-in">
          <div class="text-center mb-4">
            <h3 class="font-bold text-sm">Masukkan Kode Akses</h3>
            <p class="text-[11px] text-gray-400 mt-0.5">4 digit PIN untuk
              <span class="font-semibold" :class="pinTarget==='admin'?'text-red-600':pinTarget==='supervisor'?'text-blue-600':'text-green-600'"
                x-text="pinTarget==='admin'?'Administrator':pinTarget==='supervisor'?'Supervisor':'Teknisi'"></span>
            </p>
          </div>
          <!-- PIN dots -->
          <div class="flex justify-center gap-3 mb-5">
            <template x-for="i in 4" :key="i">
              <div class="w-12 h-12 rounded-xl border-2 flex items-center justify-center text-xl font-bold transition-all"
                :class="pinCode.length >= i ? 'border-primary bg-primary/5 text-primary' : 'border-gray-200 text-gray-300'">
                <span x-text="pinCode.length >= i ? '●' : ''"></span>
              </div>
            </template>
          </div>
          <!-- Error -->
          <template x-if="loginError && pinTarget">
            <div class="bg-danger/5 border border-danger/20 rounded-xl px-3 py-2 mb-3 text-center scale-in">
              <p class="text-danger text-xs font-medium" x-text="loginError"></p>
            </div>
          </template>
          <!-- Number pad -->
          <div class="grid grid-cols-3 gap-2 max-w-[240px] mx-auto">
            <template x-for="n in [1,2,3,4,5,6,7,8,9]" :key="n">
              <button @click="pinPress(n)" class="h-12 rounded-xl bg-gray-50 text-lg font-bold text-gray-700 btn-press hover:bg-gray-100 transition-colors"
                x-text="n"></button>
            </template>
            <button @click="pinTarget=null;pinCode='';loginError=''" class="h-12 rounded-xl bg-gray-50 text-xs font-bold text-gray-400 btn-press hover:bg-gray-100">Batal</button>
            <button @click="pinPress(0)" class="h-12 rounded-xl bg-gray-50 text-lg font-bold text-gray-700 btn-press hover:bg-gray-100">0</button>
            <button @click="pinCode=pinCode.slice(0,-1)" class="h-12 rounded-xl bg-gray-50 flex items-center justify-center btn-press hover:bg-gray-100">

<template x-if="tutorialActive">
<div>
  <div class="tutorial-overlay" @click="tutorialNext()"></div>
  <div class="tutorial-card" :style="'top:'+tutorialCardTop">
    <div class="tutorial-arrow" :class="tutorialArrowDir"></div>
    <!-- Step indicator -->
    <div class="flex items-center justify-between mb-3">
      <span class="text-[10px] font-bold text-primary bg-primary/10 px-2 py-0.5 rounded-full"
        x-text="'Langkah '+(tutorialStep+1)+'/'+tutorialSteps.length"></span>
      <button @click="endTutorial()" class="text-xs text-gray-400 font-semibold btn-press">Lewati</button>
    </div>
    <!-- Content -->
    <div class="mb-4">
      <h3 class="font-bold text-base mb-1" x-text="tutorialSteps[tutorialStep]?.title"></h3>
      <p class="text-sm text-gray-500 leading-relaxed" x-text="tutorialSteps[tutorialStep]?.desc"></p>
    </div>
    <!-- Illustration -->
    <div class="bg-gray-50 rounded-xl p-4 mb-4 flex items-center justify-center" x-show="tutorialSteps[tutorialStep]?.icon">
      <div class="w-16 h-16 rounded-2xl flex items-center justify-center"
        :class="tutorialSteps[tutorialStep]?.iconBg || 'bg-primary/10'">
        <span class="text-3xl" x-text="tutorialSteps[tutorialStep]?.icon"></span>
      </div>
    </div>
    <!-- Navigation dots + button -->
    <div class="flex items-center justify-between">
      <div class="flex gap-1.5">
        <template x-for="(s,i) in tutorialSteps" :key="i">
          <div class="tutorial-dot" :class="i===tutorialStep?'bg-primary w-6':'bg-gray-200'" style="border-radius:4px;height:8px;width:8px"
            :style="i===tutorialStep?'width:20px':''"></div>
        </template>
      </div>
      <button @click="tutorialNext()" class="bg-primary text-white text-sm font-semibold px-5 py-2 rounded-xl btn-press">
        <span x-text="tutorialStep===tutorialSteps.length-1?'Selesai!':'Lanjut'"></span>
      </button>
    </div>
  </div>
</div>
</template>

      <div class="px-4 mt-4 mb-2">

            <div class="w-9 h-9 bg-green-50 rounded-xl flex items-center justify-center flex-shrink-0">
              <svg class="w-5 h-5 text-green-600" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            </div>
            <div>
              <p class="text-xs font-bold text-gray-700">Kirim ke WA</p>
              <p class="text-[10px] text-gray-400">Ringkasan hari ini</p>
            </div>
          </button>
          <button @click="navigateTo('reports')"
            class="bg-white rounded-xl p-3.5 shadow-sm btn-press flex items-center gap-3 text-left">
            <div class="w-9 h-9 bg-blue-50 rounded-xl flex items-center justify-center flex-shrink-0">
              <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            </div>
            <div>
              <p class="text-xs font-bold text-gray-700">Performa</p>
              <p class="text-[10px] text-gray-400">Lihat statistik</p>
            </div>
          </button>
        </div>
      </div>
    </div>

    <!-- ── AKTIVITAS ── -->
    <div x-show="tab==='visits'" class="slide-up">
      <div class="px-4 pt-3">
        <!-- Date + refresh -->
        <div class="flex items-center justify-between mb-3">
          <p class="text-xs text-gray-500" x-text="todayLabel"></p>
          <button @click="loadVisits()" class="text-primary p-1 btn-press">
            <svg class="w-4.5 h-4.5" :class="visitsLoading?'animate-spin':''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          </button>
        </div>
        <!-- Filter pills -->
        <div class="flex gap-2 mb-3 overflow-x-auto">
          <button @click="visitFilter='all'" class="text-[11px] font-semibold px-3 py-1.5 rounded-full transition-all whitespace-nowrap"
            :class="visitFilter==='all'?'bg-primary text-white shadow-sm':'bg-white text-gray-500'">Semua</button>
          <button @click="visitFilter='SCHEDULED'" class="text-[11px] font-semibold px-3 py-1.5 rounded-full transition-all whitespace-nowrap"
            :class="visitFilter==='SCHEDULED'?'bg-gray-700 text-white shadow-sm':'bg-white text-gray-500'">Terjadwal</button>
          <button @click="visitFilter='IN_PROGRESS'" class="text-[11px] font-semibold px-3 py-1.5 rounded-full transition-all whitespace-nowrap"
            :class="visitFilter==='IN_PROGRESS'?'bg-warning text-white shadow-sm':'bg-white text-gray-500'">Berjalan</button>
          <button @click="visitFilter='COMPLETED'" class="text-[11px] font-semibold px-3 py-1.5 rounded-full transition-all whitespace-nowrap"
            :class="visitFilter==='COMPLETED'?'bg-success text-white shadow-sm':'bg-white text-gray-500'">Selesai</button>
        </div>
        <!-- Skeleton -->
        <template x-if="visitsLoading">
          <div class="space-y-3">
            <template x-for="i in 3">
              <div class="bg-white rounded-xl p-4 shadow-sm flex items-center gap-3">
                <div class="skeleton w-10 h-10 rounded-xl flex-shrink-0"></div>
                <div class="flex-1"><div class="skeleton h-4 w-32 mb-2"></div><div class="skeleton h-3 w-48"></div></div>
              </div>
            </template>
          </div>
        </template>
        <!-- Empty state -->
        <template x-if="!visitsLoading && filteredVisits.length===0">
          <div class="text-center py-16 fade-in">
            <svg class="w-20 h-20 mx-auto text-gray-200 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <p class="text-gray-400 font-medium">Tidak ada kunjungan</p>
            <p class="text-gray-300 text-xs mt-1" x-text="visitFilter!=='all'?'Coba filter lainnya':'Belum ada jadwal hari ini'"></p>
          </div>
        </template>
        <!-- Visit list -->
        <div class="space-y-3">
          <template x-for="v in filteredVisits" :key="v.road_plan_id">
            <div @click="openVisit(v)"
              class="bg-white rounded-xl p-4 shadow-sm flex items-center gap-3 cursor-pointer btn-press transition-all"
              :class="v.status==='IN_PROGRESS'?'border-l-4 border-warning':v.status==='COMPLETED'?'border-l-4 border-success':''">
              <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0"
                :class="v.status==='COMPLETED'?'bg-success/10':v.status==='IN_PROGRESS'?'bg-warning/10':'bg-gray-100'">
                <svg x-show="v.status==='SCHEDULED'" class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <svg x-show="v.status==='IN_PROGRESS'" class="w-5 h-5 text-warning" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <svg x-show="v.status==='COMPLETED'" class="w-5 h-5 text-success" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              </div>
              <div class="flex-1 min-w-0">
                <p class="font-semibold text-sm truncate" x-text="v.customer_name"></p>
                <p class="text-xs text-gray-400 truncate" x-text="v.customer_address || '-'"></p>
              </div>
              <div class="text-right flex-shrink-0">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full"
                  :class="v.status==='COMPLETED'?'bg-success/10 text-success':v.status==='IN_PROGRESS'?'bg-warning/10 text-warning':'bg-gray-100 text-gray-500'"
                  x-text="v.status==='COMPLETED'?'Selesai':v.status==='IN_PROGRESS'?'Berjalan':'Terjadwal'"></span>
                <p class="text-[10px] text-gray-400 mt-1" x-text="v.check_in ? formatTime(v.check_in) : '--:--'"></p>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- ── JADWAL (Dora Map + Calendar) ── -->
    <div x-show="tab==='schedule'" class="slide-up" x-init="$watch('tab',v=>{if(v==='schedule')loadSchedule()})">
      <div class="px-4 pt-3">
        <!-- Week calendar strip -->
        <div class="bg-white rounded-xl shadow-sm p-3 mb-3">
          <div class="flex items-center justify-between mb-2">
            <button @click="calPrevWeek()" class="p-1.5 btn-press text-gray-400 rounded-lg hover:bg-gray-50"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></button>
            <h3 class="text-sm font-bold" x-text="calMonthLabel"></h3>
            <button @click="calNextWeek()" class="p-1.5 btn-press text-gray-400 rounded-lg hover:bg-gray-50"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></button>
          </div>
          <div class="flex gap-1">
            <template x-for="d in calWeekDays" :key="d.iso">
              <div @click="selectCalDate(d.iso)"
                class="cal-day"
                :class="{
                  'today': d.isToday,
                  'selected': d.iso === calSelectedDate,
                  'has-visits': d.hasVisits
                }">
                <span class="cal-weekday" x-text="d.dayName"></span>
                <span class="cal-date" x-text="d.date"></span>
              </div>
            </template>
          </div>
        </div>

        <!-- Date label + count -->
        <div class="flex items-center justify-between mb-3">
          <p class="text-sm font-bold" x-text="formatDateFull(calSelectedDate)"></p>
          <span class="text-xs bg-primary/10 text-primary font-bold px-2 py-0.5 rounded-full"
            x-text="scheduleVisits.length+' kunjungan'"></span>
        </div>

        <!-- Loading -->
        <template x-if="scheduleLoading">
          <div class="space-y-3">
            <template x-for="i in 3">
              <div class="bg-white rounded-xl p-4 shadow-sm flex items-center gap-3">
                <div class="skeleton w-8 h-8 rounded-full flex-shrink-0"></div>
                <div class="flex-1"><div class="skeleton h-4 w-32 mb-2"></div><div class="skeleton h-3 w-48"></div></div>
              </div>
            </template>
          </div>
        </template>

        <!-- Empty -->
        <template x-if="!scheduleLoading && scheduleVisits.length===0">
          <div class="text-center py-12 fade-in">
            <svg class="w-16 h-16 mx-auto text-gray-200 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <p class="text-gray-400 font-medium text-sm">Tidak ada jadwal</p>
            <p class="text-gray-300 text-xs mt-1">Pilih tanggal lain di kalender</p>
          </div>
        </template>

        <!-- Journey map (Dora-style path) -->
        <template x-if="!scheduleLoading && scheduleVisits.length > 0">
          <div class="journey-path">
            <!-- Start marker -->
            <div class="flex items-center gap-2.5 mb-1 -ml-[32px] pl-0.5">
              <div class="w-[22px] h-[22px] bg-primary rounded-full flex items-center justify-center shadow-sm flex-shrink-0">
                <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
              </div>
              <span class="text-[10px] font-bold text-gray-400 uppercase">Mulai Hari</span>
            </div>

            <!-- Visit stops -->
            <template x-for="(v, idx) in scheduleVisits" :key="v.road_plan_id">
              <div class="journey-stop" :class="v.status==='COMPLETED'?'completed':v.status==='IN_PROGRESS'?'active':'pending'">
                <div class="stop-dot">
                  <span class="stop-number" x-text="idx+1" x-show="v.status!=='COMPLETED'"></span>
                  <svg x-show="v.status==='COMPLETED'" class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                </div>
                <div class="bg-white rounded-xl p-3.5 shadow-sm"
                  :class="v.status==='IN_PROGRESS'?'ring-2 ring-primary/20':''">
                  <div @click="openVisit(v)" class="btn-press cursor-pointer">
                  <div class="flex items-start justify-between gap-2">
                    <div class="flex-1 min-w-0">
                      <p class="font-bold text-sm truncate" x-text="v.customer_name"></p>
                      <p class="text-xs text-gray-400 truncate mt-0.5" x-text="v.customer_address || '-'"></p>
                    </div>
                    <div class="flex flex-col items-end flex-shrink-0">
                      <span class="text-[10px] font-bold px-2 py-0.5 rounded-full"
                        :class="v.status==='COMPLETED'?'bg-success/10 text-success':v.status==='IN_PROGRESS'?'bg-warning/10 text-warning':'bg-gray-100 text-gray-500'"
                        x-text="v.status==='COMPLETED'?'Selesai':v.status==='IN_PROGRESS'?'Berjalan':'Terjadwal'"></span>
                    </div>
                  </div>
                  <!-- Time row -->
                  <div class="flex items-center gap-3 mt-2 text-[10px]">
                    <template x-if="v.check_in">
                      <span class="flex items-center gap-1 text-success font-semibold">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14"/></svg>
                        <span x-text="formatTime(v.check_in)"></span>
                      </span>
                    </template>
                    <template x-if="v.check_out">
                      <span class="flex items-center gap-1 text-danger font-semibold">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7"/></svg>
                        <span x-text="formatTime(v.check_out)"></span>
                      </span>
                    </template>
                    <template x-if="v.check_in && v.check_out">
                      <span class="text-gray-400 flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        <span x-text="calcDuration(v.check_in, v.check_out)"></span>
                      </span>
                    </template>
                    <template x-if="v.photo_count > 0">
                      <span class="text-gray-400 flex items-center gap-0.5">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/></svg>
                        <span x-text="v.photo_count"></span>
                      </span>
                    </template>
                    <template x-if="v.remarks">
                      <span class="text-gray-400 flex items-center gap-0.5">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                        Laporan
                      </span>
                    </template>
                  </div>
                  </div><!-- /clickable area -->
                  <!-- Navigate button -->
                  <template x-if="v.status!=='COMPLETED'">
                    <button @click.stop="openGoogleMaps(v)"
                      class="mt-2 w-full flex items-center justify-center gap-2 py-2 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-lg text-xs font-semibold btn-press transition-colors">
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                      Navigasi ke Lokasi
                    </button>
                  </template>
                </div>
              </div>
            </template>

            <!-- End marker -->
            <div class="flex items-center gap-3 mt-1 -ml-[36px] pl-1">
              <div class="w-6 h-6 bg-gray-300 rounded-full flex items-center justify-center shadow-sm"
                :class="scheduleVisits.every(v=>v.status==='COMPLETED')?'bg-success':''">
                <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
              </div>
              <span class="text-[10px] font-bold uppercase"
                :class="scheduleVisits.every(v=>v.status==='COMPLETED')?'text-success':'text-gray-400'"
                x-text="scheduleVisits.every(v=>v.status==='COMPLETED')?'Hari Selesai!':'Selesaikan Semua'"></span>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- ── PELANGGAN ── -->
    <div x-show="tab==='customers'" class="slide-up">
      <div class="px-4 pt-3">
        <!-- Search bar -->
        <div class="relative mb-3">
          <svg class="w-4 h-4 text-gray-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input x-model="customerSearch" @input.debounce.400ms="loadCustomers()"
            type="search" placeholder="Cari nama / kode pelanggan..."
            class="w-full bg-white rounded-xl pl-10 pr-4 py-3 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all">
        </div>
        <!-- Skeleton -->
        <template x-if="customersLoading">
          <div class="space-y-2">
            <template x-for="i in 4">
              <div class="bg-white rounded-xl p-4 shadow-sm flex items-center gap-3">
                <div class="skeleton w-10 h-10 rounded-full"></div>
                <div class="flex-1"><div class="skeleton h-4 w-28 mb-2"></div><div class="skeleton h-3 w-40"></div></div>
              </div>
            </template>
          </div>
        </template>
        <!-- Empty -->
        <template x-if="!customersLoading && customers.length===0 && customerSearch">
          <div class="text-center py-16 fade-in">
            <svg class="w-16 h-16 mx-auto text-gray-200 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <p class="text-gray-400 font-medium">Tidak ditemukan</p>
            <p class="text-gray-300 text-xs mt-1">Coba kata kunci lain</p>
          </div>
        </template>
        <!-- List -->
        <div class="space-y-2">
          <template x-for="c in customers" :key="c.id">
            <div @click="openCustomerDetail(c)" class="bg-white rounded-xl p-4 shadow-sm flex items-center gap-3 btn-press cursor-pointer">
              <div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center flex-shrink-0">
                <span class="text-primary font-bold text-sm" x-text="(c.name||'?').charAt(0)"></span>
              </div>
              <div class="flex-1 min-w-0">
                <p class="font-semibold text-sm truncate" x-text="c.name"></p>
                <p class="text-xs text-gray-400 truncate" x-text="c.address || '-'"></p>
              </div>
              <div class="flex items-center gap-2 flex-shrink-0">
                <template x-if="c.segment">
                  <span class="text-[10px] bg-orange-50 text-orange-600 font-semibold px-2 py-0.5 rounded-full" x-text="c.segment"></span>
                </template>
                <svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- ── APPROVAL ── -->
    <div x-show="tab==='approvals'" class="slide-up" x-init="$watch('tab',v=>{if(v==='approvals')loadApprovals()})">
      <div class="px-4 pt-3">
        <p class="text-xs text-gray-500 mb-3" x-text="approvals.length+' menunggu persetujuan'"></p>
        <template x-if="approvals.length===0">
          <div class="text-center py-16 fade-in">
            <svg class="w-20 h-20 mx-auto text-gray-200 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <p class="text-gray-400 font-medium">Semua beres!</p>
            <p class="text-gray-300 text-xs mt-1">Tidak ada approval pending</p>
          </div>
        </template>
        <div class="space-y-3">
          <template x-for="a in approvals" :key="a.id">
            <div class="bg-white rounded-xl p-4 shadow-sm">
              <div class="mb-2">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-warning/10 text-warning" x-text="a.action_type"></span>
                <p class="font-semibold text-sm mt-1" x-text="a.technician_name || '-'"></p>
                <p class="text-xs text-gray-400" x-text="a.customer_name || ''"></p>
              </div>
              <p class="text-xs text-gray-500 mb-3" x-text="a.description || ''"></p>
              <div class="flex gap-2">
                <button @click="doApprove(a.id)"
                  class="flex-1 bg-success text-white text-xs font-bold py-2.5 rounded-xl btn-press flex items-center justify-center gap-1">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                  Approve
                </button>
                <button @click="doReject(a.id)"
                  class="flex-1 bg-white border border-danger text-danger text-xs font-bold py-2.5 rounded-xl btn-press flex items-center justify-center gap-1">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                  Reject
                </button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- ── LAPORAN PENGERJAAN ── -->
    <div x-show="tab==='reports'" class="slide-up">
      <div class="px-4 pt-3">

        <!-- Performance Stats -->
        <div class="mb-4">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-bold text-sm text-gray-700">Performa Saya</h3>
            <button @click="loadPerformance()" class="text-xs text-primary font-semibold btn-press" x-show="!perfLoading">
              <svg class="w-3.5 h-3.5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            </button>
            <div x-show="perfLoading" class="w-4 h-4 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div>
          </div>

          <!-- Week Stats -->
          <template x-if="perfData">
          <div class="space-y-3">
            <div class="bg-white rounded-xl p-4 shadow-sm">
              <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-3">Minggu Ini</p>
              <div class="grid grid-cols-3 gap-3 mb-3">
                <div class="text-center">
                  <p class="text-2xl font-bold text-primary" x-text="perfData.week.completed || 0"></p>
                  <p class="text-[10px] text-gray-400">Selesai</p>
                </div>
                <div class="text-center">
                  <p class="text-2xl font-bold text-gray-700" x-text="perfData.week.planned || 0"></p>
                  <p class="text-[10px] text-gray-400">Terjadwal</p>
                </div>
                <div class="text-center">
                  <p class="text-2xl font-bold" :class="perfData.week.completion_rate >= 80 ? 'text-success' : perfData.week.completion_rate >= 50 ? 'text-warning' : 'text-danger'"
                    x-text="perfData.week.completion_rate + '%'"></p>
                  <p class="text-[10px] text-gray-400">Rate</p>
                </div>
              </div>
              <!-- Progress bar -->
              <div class="bg-gray-100 rounded-full h-2 overflow-hidden">
                <div class="h-full rounded-full transition-all duration-500"
                  :class="perfData.week.completion_rate >= 80 ? 'bg-success' : perfData.week.completion_rate >= 50 ? 'bg-warning' : 'bg-danger'"
                  :style="'width:'+Math.min(perfData.week.completion_rate,100)+'%'"></div>
              </div>
              <div class="flex justify-between mt-2 text-[10px] text-gray-400">
                <span x-text="(perfData.week.days_worked||0)+' hari kerja'"></span>
                <span x-text="'Rata-rata '+(perfData.week.avg_duration_min||'-')+' menit/visit'"></span>
              </div>
            </div>

            <!-- Month Stats -->
            <div class="bg-white rounded-xl p-4 shadow-sm">
              <div class="flex items-center justify-between mb-3">
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider" x-text="perfData.month.label || 'Bulan Ini'"></p>
                <template x-if="perfData.prev_month && perfData.prev_month.completion_rate !== undefined">
                  <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full"
                    :class="perfData.month.completion_rate >= perfData.prev_month.completion_rate ? 'bg-success/10 text-success' : 'bg-danger/10 text-danger'">
                    <span x-text="perfData.month.completion_rate >= perfData.prev_month.completion_rate ? '↑' : '↓'"></span>
                    vs <span x-text="perfData.prev_month.completion_rate+'%'"></span> bln lalu
                  </span>
                </template>
              </div>
              <div class="grid grid-cols-4 gap-2">
                <div class="bg-primary/5 rounded-lg p-2.5 text-center">
                  <p class="text-lg font-bold text-primary" x-text="perfData.month.completed || 0"></p>
                  <p class="text-[9px] text-gray-400">Selesai</p>
                </div>
                <div class="bg-gray-50 rounded-lg p-2.5 text-center">
                  <p class="text-lg font-bold text-gray-600" x-text="perfData.month.planned || 0"></p>
                  <p class="text-[9px] text-gray-400">Jadwal</p>
                </div>
                <div class="bg-success/5 rounded-lg p-2.5 text-center">
                  <p class="text-lg font-bold text-success" x-text="perfData.month.completion_rate + '%'"></p>
                  <p class="text-[9px] text-gray-400">Rate</p>
                </div>
                <div class="bg-accent/5 rounded-lg p-2.5 text-center">
                  <p class="text-lg font-bold text-accent" x-text="perfData.month.days_worked || 0"></p>
                  <p class="text-[9px] text-gray-400">Hari</p>
                </div>
              </div>
            </div>

            <!-- Recent activity log -->
            <div class="bg-white rounded-xl p-4 shadow-sm">
              <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-3">Aktivitas 7 Hari Terakhir</p>
              <template x-if="perfData.recent_visits && perfData.recent_visits.length > 0">
                <div class="space-y-2 max-h-64 overflow-y-auto">
                  <template x-for="(rv,i) in perfData.recent_visits" :key="i">
                    <div class="flex items-center gap-2.5 py-1.5 border-b border-gray-50 last:border-0">
                      <div class="w-2 h-2 rounded-full flex-shrink-0"
                        :class="rv.status==='COMPLETED'?'bg-success':rv.status==='IN_PROGRESS'?'bg-warning':'bg-gray-300'"></div>
                      <div class="flex-1 min-w-0">
                        <p class="text-xs font-medium truncate" x-text="rv.customer_name"></p>
                        <p class="text-[10px] text-gray-400" x-text="formatDateFull(rv.visit_date)"></p>
                      </div>
                      <template x-if="rv.check_in && rv.check_out">
                        <span class="text-[10px] text-gray-400" x-text="formatTime(rv.check_in)+' - '+formatTime(rv.check_out)"></span>
                      </template>
                      <template x-if="rv.check_in && !rv.check_out">
                        <span class="text-[10px] text-warning font-medium">Berjalan</span>
                      </template>
                      <template x-if="!rv.check_in">
                        <span class="text-[10px] text-gray-300">-</span>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
              <template x-if="!perfData.recent_visits || perfData.recent_visits.length === 0">
                <p class="text-xs text-gray-400 text-center py-3">Belum ada data</p>
              </template>
            </div>
            <!-- Share to WA button -->
            <button @click="shareToWhatsApp('performance')"
              class="w-full mt-3 flex items-center justify-center gap-2 py-3 bg-green-50 hover:bg-green-100 text-green-700 rounded-xl text-xs font-bold btn-press transition-colors">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
              Kirim Performa ke WhatsApp
            </button>
          </div>
          </template>

          <template x-if="!perfData && !perfLoading">
            <div class="bg-white rounded-xl p-6 shadow-sm text-center">
              <button @click="loadPerformance()" class="text-sm text-primary font-semibold btn-press">Muat Data Performa</button>
            </div>
          </template>
        </div>

        <!-- Divider -->
        <div class="flex items-center gap-2 mb-3">
          <div class="h-px flex-1 bg-gray-200"></div>
          <span class="text-[10px] font-bold text-gray-400 uppercase">Laporan Hari Ini</span>
          <div class="h-px flex-1 bg-gray-200"></div>
        </div>

        <!-- Today's completed visits with reports -->
        <template x-if="visits.filter(v=>v.status==='COMPLETED').length === 0">
          <div class="text-center py-12 fade-in">
            <svg class="w-16 h-16 mx-auto text-gray-200 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <p class="text-gray-400 font-medium text-sm">Belum ada laporan</p>
            <p class="text-gray-300 text-xs mt-1">Selesaikan kunjungan untuk membuat laporan</p>
          </div>
        </template>
        <div class="space-y-3">
          <template x-for="v in visits.filter(v=>v.status==='COMPLETED')" :key="v.road_plan_id">
            <div class="bg-white rounded-xl shadow-sm overflow-hidden">
              <div class="p-4">
                <div class="flex items-center gap-2 mb-2">
                  <div class="w-2 h-2 bg-success rounded-full"></div>
                  <p class="font-bold text-sm" x-text="v.customer_name"></p>
                </div>
                <div class="flex items-center gap-3 text-[10px] text-gray-400 mb-3">
                  <span class="flex items-center gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span x-text="formatTime(v.check_in)+' - '+formatTime(v.check_out)"></span>
                  </span>
                  <template x-if="v.check_in && v.check_out">
                    <span x-text="calcDuration(v.check_in, v.check_out)"></span>
                  </template>
                </div>
                <!-- Report content -->
                <template x-if="v.remarks">
                  <div class="bg-gray-50 rounded-lg p-3 mb-2">
                    <p class="text-xs font-semibold text-gray-500 mb-1">Catatan Pengerjaan:</p>
                    <p class="text-sm text-gray-700" x-text="v.remarks"></p>
                  </div>
                </template>
                <template x-if="!v.remarks">
                  <div class="bg-warning/5 border border-warning/20 rounded-lg p-3 mb-2">
                    <p class="text-xs text-warning font-semibold">Belum ada catatan pengerjaan</p>
                  </div>
                </template>
                <template x-if="v.photo_count > 0">
                  <div class="flex items-center gap-1 text-[10px] text-gray-400">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/></svg>
                    <span x-text="v.photo_count+' foto bukti'"></span>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>

        <!-- In-progress visits needing reports -->
        <template x-if="visits.filter(v=>v.status==='IN_PROGRESS').length > 0">
          <div class="mt-4">
            <p class="text-xs font-bold text-warning mb-2">Sedang Berlangsung — Perlu Laporan</p>
            <template x-for="v in visits.filter(v=>v.status==='IN_PROGRESS')" :key="v.road_plan_id">
              <div @click="openVisit(v)" class="bg-warning/5 border border-warning/20 rounded-xl p-4 flex items-center gap-3 btn-press cursor-pointer mb-2">
                <div class="w-8 h-8 bg-warning/20 rounded-lg flex items-center justify-center">
                  <svg class="w-4 h-4 text-warning" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                </div>
                <div class="flex-1 min-w-0">
                  <p class="font-semibold text-sm truncate" x-text="v.customer_name"></p>
                  <p class="text-xs text-warning">Tap untuk isi laporan & check-out</p>
                </div>
                <svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
              </div>
            </template>
          </div>
        </template>

        <!-- Share daily report to WA -->
        <button @click="shareToWhatsApp('daily')"
          class="w-full mt-4 flex items-center justify-center gap-2 py-3 bg-green-50 hover:bg-green-100 text-green-700 rounded-xl text-xs font-bold btn-press transition-colors">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          Kirim Laporan Harian ke WhatsApp
        </button>
      </div>
    </div>

    <!-- ── KOMPLAIN ── -->
    <div x-show="tab==='complaints'" class="slide-up">
      <div class="px-4 pt-3">
        <!-- Stats pills -->
        <div class="flex gap-2 mb-3 overflow-x-auto">
          <button @click="complaintFilter='open,in_progress';loadComplaints()" class="flex-shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold transition-colors"
            :class="complaintFilter==='open,in_progress'?'bg-primary text-white':'bg-white text-gray-500'">
            Aktif <span x-text="'('+(complaintStats.open_count||0)+')'"></span>
          </button>
          <button @click="complaintFilter='resolved';loadComplaints()" class="flex-shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold transition-colors"
            :class="complaintFilter==='resolved'?'bg-primary text-white':'bg-white text-gray-500'">
            Selesai <span x-text="'('+(complaintStats.resolved_count||0)+')'"></span>
          </button>
          <button @click="complaintFilter='all';loadComplaints()" class="flex-shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold transition-colors"
            :class="complaintFilter==='all'?'bg-primary text-white':'bg-white text-gray-500'">
            Semua <span x-text="'('+(complaintStats.total||0)+')'"></span>
          </button>
        </div>

        <!-- New complaint button -->
        <template x-if="isSupervisor">
          <button @click="showComplaintForm=true"
            class="w-full mb-3 flex items-center justify-center gap-2 py-3 bg-primary text-white rounded-xl text-xs font-bold btn-press shadow-lg shadow-primary/20">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Tambah Komplain Baru
          </button>
        </template>

        <!-- Loading -->
        <template x-if="complaintsLoading">
          <div class="space-y-3">
            <template x-for="i in 3"><div class="bg-white rounded-xl p-4 shadow-sm"><div class="skeleton h-5 w-40 mb-2"></div><div class="skeleton h-3 w-full mb-1"></div><div class="skeleton h-3 w-24"></div></div></template>
          </div>
        </template>

        <!-- Empty -->
        <template x-if="!complaintsLoading && complaintsList.length === 0">
          <div class="text-center py-12 fade-in">
            <svg class="w-16 h-16 mx-auto text-gray-200 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <p class="text-gray-400 font-medium text-sm">Tidak ada komplain</p>
          </div>
        </template>

        <!-- Complaints list -->
        <div class="space-y-3">
          <template x-for="ct in complaintsList" :key="ct.id">
            <div @click="openComplaint(ct)" class="bg-white rounded-xl p-4 shadow-sm btn-press cursor-pointer">
              <div class="flex items-start justify-between gap-2 mb-2">
                <div class="flex-1 min-w-0">
                  <p class="font-bold text-sm truncate" x-text="ct.title"></p>
                  <p class="text-xs text-gray-400 truncate" x-text="ct.customer_name"></p>
                </div>
                <div class="flex flex-col items-end gap-1 flex-shrink-0">
                  <span class="text-[9px] font-bold px-2 py-0.5 rounded-full"
                    :class="ct.severity==='critical'?'bg-red-100 text-red-700':ct.severity==='high'?'bg-orange-100 text-orange-700':'bg-yellow-100 text-yellow-700'"
                    x-text="ct.severity"></span>
                  <span class="text-[9px] font-bold px-2 py-0.5 rounded-full"
                    :class="ct.status==='open'?'bg-red-50 text-red-600':ct.status==='in_progress'?'bg-blue-50 text-blue-600':ct.status==='resolved'?'bg-green-50 text-green-600':'bg-gray-100 text-gray-500'"
                    x-text="ct.status==='open'?'Baru':ct.status==='in_progress'?'Proses':ct.status==='resolved'?'Selesai':'Ditutup'"></span>
                </div>
              </div>
              <template x-if="ct.description">
                <p class="text-xs text-gray-500 line-clamp-2 mb-2" x-text="ct.description"></p>
              </template>
              <div class="flex items-center gap-3 text-[10px] text-gray-400">
                <template x-if="ct.assigned_name">
                  <span class="flex items-center gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    <span x-text="ct.assigned_name"></span>
                  </span>
                </template>
                <span x-text="ct.created_at ? ct.created_at.slice(0,10) : ''"></span>
                <template x-if="ct.category">
                  <span class="bg-gray-100 px-1.5 py-0.5 rounded text-[9px]" x-text="ct.category"></span>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- ── PROFIL ── -->
    <div x-show="tab==='profile'" class="slide-up">

                <div class="flex items-center gap-2 text-[11px] text-gray-500">
                  <svg class="w-3 h-3 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                  <span x-text="v.technician_name || '-'"></span>

                <template x-if="v.check_in">

                    </template>

                      <span class="flex items-center gap-0.5">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/></svg>
                        <span x-text="v.photo_count"></span>
                      </span>
                    </template>
                  </div>
                </template>
                <template x-if="v.remarks">

              </div>
            </template>
          </div>
          <!-- Date range -->
          <template x-if="customerDetail.stats.first_visit">
            <p class="text-[10px] text-gray-300 text-center mt-3">

            </p>
          </template>
        </div>
      </div>
      </template>
    </div>
  </div>

  <!-- ══ COMPLAINT DETAIL OVERLAY ══ -->
  <template x-if="activeComplaint">
  <div class="fixed inset-0 z-50 bg-white slide-in-right overflow-y-auto max-w-lg mx-auto">
    <header class="bg-white px-4 pt-10 pb-3 flex items-center gap-3 shadow-sm safe-top sticky top-0 z-10">
      <button @click="activeComplaint=null" class="p-2 -ml-2 rounded-xl hover:bg-gray-100 btn-press">
        <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div class="flex-1 min-w-0">
        <h1 class="text-base font-bold truncate" x-text="activeComplaint.title"></h1>
        <p class="text-xs text-gray-400" x-text="activeComplaint.customer_name || ''"></p>
      </div>
      <span class="text-[9px] font-bold px-2 py-0.5 rounded-full flex-shrink-0"
        :class="activeComplaint.severity==='critical'?'bg-red-100 text-red-700':activeComplaint.severity==='high'?'bg-orange-100 text-orange-700':'bg-yellow-100 text-yellow-700'"
        x-text="activeComplaint.severity"></span>
    </header>

    <div class="px-4 pt-4 pb-8 space-y-4">
      <!-- Status + actions -->
      <div class="bg-white rounded-xl border border-gray-100 p-4">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-bold"
            :class="activeComplaint.status==='open'?'text-red-600':activeComplaint.status==='in_progress'?'text-blue-600':activeComplaint.status==='resolved'?'text-green-600':'text-gray-500'"
            x-text="'Status: '+(activeComplaint.status==='open'?'Baru':activeComplaint.status==='in_progress'?'Dalam Proses':activeComplaint.status==='resolved'?'Selesai':'Ditutup')"></span>
        </div>
        <template x-if="isSupervisor && activeComplaint.status !== 'resolved' && activeComplaint.status !== 'closed'">
          <div class="flex gap-2">
            <template x-if="activeComplaint.status==='open'">
              <button @click="updateComplaintStatus(activeComplaint.id,'in_progress')"
                class="flex-1 py-2 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold btn-press">Proses</button>
            </template>
            <button @click="resolveComplaintPrompt(activeComplaint.id)"
              class="flex-1 py-2 bg-green-50 text-green-600 rounded-lg text-xs font-bold btn-press">Selesaikan</button>
          </div>
        </template>
      </div>

      <!-- Info -->
      <div class="bg-white rounded-xl border border-gray-100 p-4 space-y-2.5 text-sm">
        <template x-if="activeComplaint.description">
          <div>
            <p class="text-[10px] font-bold text-gray-400 uppercase mb-1">Deskripsi</p>
            <p class="text-gray-700" x-text="activeComplaint.description"></p>
          </div>
        </template>
        <template x-if="activeComplaint.category">
          <div class="flex gap-3 items-center"><span class="text-gray-400 text-xs">Kategori:</span><span class="text-xs font-medium" x-text="activeComplaint.category"></span></div>
        </template>
        <template x-if="activeComplaint.assigned_name">
          <div class="flex gap-3 items-center"><span class="text-gray-400 text-xs">Ditangani:</span><span class="text-xs font-medium" x-text="activeComplaint.assigned_name"></span></div>
        </template>
        <template x-if="activeComplaint.reported_by">
          <div class="flex gap-3 items-center"><span class="text-gray-400 text-xs">Pelapor:</span><span class="text-xs font-medium" x-text="activeComplaint.reported_by"></span></div>
        </template>
        <template x-if="activeComplaint.resolution">
          <div class="bg-green-50 rounded-lg p-3 mt-2">
            <p class="text-[10px] font-bold text-green-700 mb-1">Resolusi</p>
            <p class="text-xs text-green-800" x-text="activeComplaint.resolution"></p>
          </div>
        </template>
        <div class="flex gap-3 items-center text-[10px] text-gray-400 pt-2 border-t border-gray-50">
          <span x-text="'Dibuat: '+(activeComplaint.created_at||'').slice(0,10)"></span>
          <template x-if="activeComplaint.resolved_at">
            <span x-text="'Selesai: '+(activeComplaint.resolved_at||'').slice(0,10)"></span>
          </template>
        </div>
      </div>
    </div>
  </div>
  </template>

  <!-- ══ NEW COMPLAINT FORM OVERLAY ══ -->
  <template x-if="showComplaintForm">
  <div class="fixed inset-0 z-50 bg-white slide-in-right overflow-y-auto max-w-lg mx-auto">
    <header class="bg-white px-4 pt-10 pb-3 flex items-center gap-3 shadow-sm safe-top sticky top-0 z-10">
      <button @click="showComplaintForm=false" class="p-2 -ml-2 rounded-xl hover:bg-gray-100 btn-press">
        <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
      <h1 class="text-base font-bold">Komplain Baru</h1>
    </header>

    <div class="px-4 pt-4 pb-8 space-y-4">
      <!-- Customer search -->
      <div>
        <label class="text-xs font-bold text-gray-500 mb-1.5 block">Pelanggan *</label>
        <input type="text" x-model="newComplaint.customerSearch" @input.debounce.300ms="searchComplaintCustomer()"
          placeholder="Cari nama pelanggan..."
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20">
        <template x-if="newComplaint.customerResults.length > 0">
          <div class="bg-white border border-gray-200 rounded-xl mt-1 max-h-40 overflow-y-auto shadow-lg">
            <template x-for="c in newComplaint.customerResults" :key="c.id">
              <button @click="newComplaint.customer_id=c.id;newComplaint.customerSearch=c.name;newComplaint.customerResults=[]"
                class="w-full text-left px-4 py-2.5 text-sm hover:bg-primary/5 border-b border-gray-50 last:border-0 btn-press">
                <span class="font-medium" x-text="c.name"></span>
                <span class="text-[10px] text-gray-400 block" x-text="c.address || c.code"></span>
              </button>
            </template>
          </div>
        </template>
        <template x-if="newComplaint.customer_id">
          <p class="text-[10px] text-success mt-1 font-medium">Pelanggan dipilih (ID: <span x-text="newComplaint.customer_id"></span>)</p>
        </template>
      </div>

      <!-- Title -->
      <div>
        <label class="text-xs font-bold text-gray-500 mb-1.5 block">Judul Komplain *</label>
        <input type="text" x-model="newComplaint.title" placeholder="Ringkasan masalah..."
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20">
      </div>

      <!-- Description -->
      <div>
        <label class="text-xs font-bold text-gray-500 mb-1.5 block">Deskripsi</label>
        <textarea x-model="newComplaint.description" rows="3" placeholder="Detail masalah..."
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 resize-none"></textarea>
      </div>

      <!-- Severity & Category -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-bold text-gray-500 mb-1.5 block">Tingkat</label>
          <select x-model="newComplaint.severity"
            class="w-full border border-gray-200 rounded-xl px-3 py-3 text-sm bg-white focus:outline-none focus:border-primary">
            <option value="low">Rendah</option>
            <option value="medium" selected>Sedang</option>
            <option value="high">Tinggi</option>
            <option value="critical">Kritis</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-bold text-gray-500 mb-1.5 block">Kategori</label>
          <select x-model="newComplaint.category"
            class="w-full border border-gray-200 rounded-xl px-3 py-3 text-sm bg-white focus:outline-none focus:border-primary">
            <option value="service">Layanan</option>
            <option value="billing">Tagihan</option>
            <option value="quality">Kualitas</option>
            <option value="scheduling">Jadwal</option>
            <option value="other">Lainnya</option>
          </select>
        </div>
      </div>

      <!-- Reported by -->
      <div>
        <label class="text-xs font-bold text-gray-500 mb-1.5 block">Dilaporkan oleh</label>
        <input type="text" x-model="newComplaint.reported_by" placeholder="Nama pelapor / PIC pelanggan"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20">
      </div>

      <!-- Submit -->
      <button @click="submitComplaint()" :disabled="complaintSubmitting"
        class="w-full bg-primary text-white font-bold py-4 rounded-xl btn-press shadow-lg shadow-primary/20 disabled:opacity-50 flex items-center justify-center gap-2">
        <template x-if="complaintSubmitting"><div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div></template>
        <template x-if="!complaintSubmitting">
          <span>Simpan Komplain</span>
        </template>
      </button>
    </div>
  </div>
  </template>

        <svg x-show="toast.type!=='success'" class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
