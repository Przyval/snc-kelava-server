_format_version: "2.1"
_transform: true

###
### Supabase Kong Gateway Configuration
### Routes API requests to Auth service
###

services:
  # Auth Service Routing
  - name: auth-v1
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-verify
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors

  - name: auth-v1-callback
    url: http://auth:9999/callback
    routes:
      - name: auth-v1-callback-route
        strip_path: true
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors

  - name: auth-v1-authorize
    url: http://auth:9999/authorize
    routes:
      - name: auth-v1-authorize-route
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors

  # Main Auth Service (signup, login, user management)
  - name: auth-v1-api
    _comment: "GoTrue: /auth/v1/* -> http://auth:9999/*"
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Client-Info
            - apikey
          exposed_headers:
            - X-Total-Count
          credentials: true
          max_age: 3600

###
### Global Plugins
###
plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Client-Info
        - apikey
      exposed_headers:
        - X-Total-Count
      credentials: true
      max_age: 3600

