server {
    listen 80;
    server_name safencare.work www.safencare.work;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name safencare.work www.safencare.work;

    ssl_certificate     /etc/letsencrypt/live/safencare.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/safencare.work/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # Static assets (enterprise portal)
    location /static/ {
        alias /root/kil-server/kil/backend/legacy/web/enterprise/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # App proxy
    location / {
        proxy_pass         http://127.0.0.1:5002;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
